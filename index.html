function rRoutineStudy(s, m, showLeave){
  var offset=(S.routineWeekOffset&&S.routineWeekOffset[s.id])||0;
  var mon=getThisWeekMonday();
  mon.setDate(mon.getDate()+offset*7);
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);}
  var today=new Date();today.setHours(0,0,0,0);
  var todayKey=toDateKey(today);
  var isExpCI=S.expandedCI[s.id]===true;
  var rtnTab=(S.rtnTab&&S.rtnTab[s.id])||'check';

  var todaySt=rtnCk(s.id,todayKey,m.id);
  var todayMemo=rtnMemo(s.id,todayKey,m.id);
  var doneCnt=days.filter(function(d){return rtnCk(s.id,toDateKey(d),m.id)==='done';}).length;
  var diaCnt=getRoutineDiamondCount(s.id,m.id);
  var rDeck=routineDeck(s);

  var h='<div style="background:var(--wh);border:1.5px solid '+(todaySt==='done'?'var(--pr)':todaySt==='vacation'?'#3B82F6':'#D3DFDA')+';border-radius:var(--r);overflow:hidden;margin-left:4px;margin-bottom:6px;position:relative;padding-top:14px;">';

  // 헤더
  h+='<div style="padding:.75rem 1rem;">';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">';
  h+='<span style="flex:1;font-size:14px;font-weight:700;cursor:pointer;" data-expci="'+s.id+'">'+esc(s.name)+'</span>';
  if(diaCnt)h+='<span title="누적 다이아 '+diaCnt+'개 (매달 50% 이상 인증 시 1개씩 적립)">💎×'+diaCnt+'</span>';
  h+='<span style="font-size:11px;color:var(--mu);">'+doneCnt+'/7일</span>';
  if(showLeave)h+='<button class="kk-del" data-cancel-apply="'+s.id+'" title="내 목록에서 삭제">삭제</button>';
  h+='<span style="font-size:12px;color:var(--mu);cursor:pointer;" data-expci="'+s.id+'">'+(isExpCI?'▲':'▼')+'</span>';
  h+='</div>';

  // 오늘: 날짜 + 인증/휴가(크게) + 메모(짧게) + (연결된 카드덱 있으면) 카드선택
  h+='<div style="font-size:11px;color:var(--mu);margin-bottom:6px;">오늘 '+toKorDate(today)+'</div>';
  h+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">';
  h+='<button data-rtn-ck="'+s.id+'__'+todayKey+'__'+m.id+'__done" style="flex:1;padding:8px 0;border-radius:var(--rs);border:none;cursor:pointer;font-size:14px;font-weight:700;background:'+(todaySt==='done'?'var(--pr)':'#DCFCE7')+';color:'+(todaySt==='done'?'#fff':'#16A34A')+';">✅ 인증</button>';
  h+='<button data-rtn-ck="'+s.id+'__'+todayKey+'__'+m.id+'__vacation" style="flex:1;padding:8px 0;border-radius:var(--rs);border:none;cursor:pointer;font-size:14px;font-weight:700;background:'+(todaySt==='vacation'?'#2563EB':'#DBEAFE')+';color:'+(todaySt==='vacation'?'#fff':'#2563EB')+';">🏖️ 휴가</button>';
  h+='<input data-rtn-memo="'+s.id+'__'+todayKey+'__'+m.id+'" placeholder="메모" value="'+esc(todayMemo)+'" style="width:80px;flex-shrink:0;font-size:11px;padding:8px 7px;border-radius:var(--rs);border:1px solid var(--br);background:var(--wh);color:var(--tx);" maxlength="30">';
  if(rDeck){
    var todayCards=rtnCards(s.id,todayKey,m.id);
    h+='<button data-rtn-cardpop="'+s.id+'__'+todayKey+'__'+m.id+'" style="flex-shrink:0;padding:8px 10px;border-radius:var(--rs);border:1px solid var(--br);cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;background:'+(todayCards.length?'var(--prl)':'var(--wh)')+';color:'+(todayCards.length?'var(--pr)':'var(--mu)')+';">🗂️'+(todayCards.length?' '+todayCards.length:'')+'</button>';
  }
  h+='</div>';
  h+='</div>';

  // 펼쳐진 상태

    h+='<div style="display:flex;border-top:1px solid #D3DFDA;">';
    h+='<button data-rtn-tab="'+s.id+'__check" style="flex:1;padding:6px;font-size:12px;font-weight:700;border:none;cursor:pointer;background:'+(rtnTab==='check'?'var(--prl)':'var(--wh)')+';color:'+(rtnTab==='check'?'var(--pr)':'var(--mu)')+';">📅 이번 주</button>';

      var dayNames=['월','화','수','목','금','토','일'];
      days.forEach(function(d,i){
        var dk=toDateKey(d);
        var st=rtnCk(s.id,dk,m.id);
        var memo=rtnMemo(s.id,dk,m.id);
        var isTodayD=dk===todayKey;
        var isFuture=d>today;
        var rowBg=isTodayD?'var(--prl)':st==='done'?'#F0FDF4':st==='vacation'?'#EFF6FF':'var(--wh)';
        var borderCol=isTodayD?'var(--pr)':st==='done'?'#BBF7D0':st==='vacation'?'#BFDBFE':'#F3F4F6';

// ── 루틴 월별 달력 모달 ──
function rRoutineCal(sid, mid, ym){
  var s=S.studies.filter(function(x){return x.id===sid;})[0];
  var m=S.members.filter(function(x){return x.id===mid;})[0];
  if(!s||!m)return '';
  var today=new Date();
  var ymKey=ym||(today.getFullYear()+'-'+(today.getMonth()+1+'').padStart(2,'0'));
  var yma=ymKey.split('-');var yr=+yma[0],mo=+yma[1]-1;
  var firstDay=new Date(yr,mo,1).getDay();
  if(firstDay===0)firstDay=7; // 월요일 시작
  firstDay=firstDay-1;
  var lastDate=new Date(yr,mo+1,0).getDate();
  var prevYm=mo===0?(yr-1)+'-12':yr+'-'+(mo+'').padStart(2,'0');
  var nextYm=mo===11?(yr+1)+'-01':yr+'-'+(mo+2+'').padStart(2,'0');
  var canNext=new Date(yr,mo+1,1)<=today;

  var h='<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;" id="rtn-cal-modal">';
  h+='<div style="background:var(--wh);border-radius:var(--r);padding:1.25rem;width:min(360px,92vw);max-height:90vh;overflow-y:auto;">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  h+='<span style="font-size:14px;font-weight:700;color:var(--pr);">📅 '+esc(s.name)+'</span>';
  h+='<button id="rtn-cal-close" style="font-size:18px;background:none;border:none;cursor:pointer;color:var(--mu);">✕</button>';
  h+='</div>';
  h+='<div style="font-size:12px;color:var(--mu);margin-bottom:12px;">'+esc(m.name)+'님의 루틴 현황</div>';
  // 월 네비
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  h+='<button data-rtn-cal-ym="'+prevYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:0;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;">◀</button>';
  h+='<span style="font-size:13px;font-weight:700;color:var(--pr);">'+yr+'년 '+(mo+1)+'월</span>';
  h+='<button data-rtn-cal-ym="'+nextYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:0;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;opacity:'+(canNext?'1':'0.3')+';pointer-events:'+(canNext?'auto':'none')+';">▶</button>';
  h+='</div>';
  // 달력 헤더
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">';
  ['월','화','수','목','금','토','일'].forEach(function(d,i){
    h+='<div style="text-align:center;font-size:10px;font-weight:700;color:'+(i>=5?'#EF4444':'var(--mu)')+';">'+d+'</div>';
  });
  h+='</div>';
  // 달력 날짜
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">';
  for(var i=0;i<firstDay;i++)h+='<div></div>';
  var doneCnt=0,totalCnt=lastDate; // 한 달 전체 일수 기준
  for(var d=1;d<=lastDate;d++){
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    var st=rtnCk(sid,dk,mid);
    var dateObj=new Date(yr,mo,d);
    var isFuture=dateObj>today;
    var dow=dateObj.getDay();
    var isWeekend=dow===0||dow===6;
    if(st==='done')doneCnt++;
    var bg=st==='done'?'var(--pr)':st==='vacation'?'#3B82F6':isWeekend?'#FEF2F2':'#F8F9FA';
    var txtCol=st==='done'||st==='vacation'?'#fff':isWeekend?'#EF4444':'var(--tx)';
    var calMemo=rtnMemo(sid,dk,mid);
    var calCards=rtnCards(sid,dk,mid);
    h+='<div style="position:relative;">';
    h+='<div '+((!isFuture)?'data-cal-memo="'+sid+'__'+dk+'__'+mid+'" style="cursor:pointer;"':'style=""')+'>';
    h+='<div style="aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:'+bg+';color:'+txtCol+';'+(isFuture?'opacity:.3':'')+' position:relative;">'+d+'</div>';
    if(calMemo)h+='<div style="position:absolute;bottom:-1px;right:-1px;width:7px;height:7px;background:#F59E0B;border-radius:50%;border:1.5px solid #fff;"></div>';
    if(calCards.length)h+='<div title="'+calCards.length+'장"'+' style="position:absolute;top:-1px;right:-1px;width:7px;height:7px;background:var(--pr);border-radius:50%;border:1.5px solid #fff;"></div>';
    h+='</div>';
    h+='</div>';
  }
  h+='</div>';
  // 요약
  var pct=totalCnt?Math.round(doneCnt/totalCnt*100):0;
  h+='<div style="margin-top:12px;padding:.75rem;background:var(--prl);border-radius:var(--rs);text-align:center;">';
  h+='<div style="font-size:13px;font-weight:700;color:var(--pr);">✅ '+doneCnt+'일 달성 / 전체 '+totalCnt+'일 · '+pct+'%</div>';
  h+='</div>';
  h+='</div></div>';
  h+=rCalMemoPopup();
  return h;
}
// 날짜 메모 팝업 (내 현황 미니달력 / 멤버 현황 달력 공용)

// 루틴 카드 선택 UI (검색 + 체크박스 목록). 메모 팝업 / 전용 카드 팝업 공용

    h+='<div style="font-size:12px;color:var(--mu);text-align:center;padding:.75rem;">덱에 등록된 카드가 없어요</div>';
  } else if(!shown.length){
    h+='<div style="font-size:12px;color:var(--mu);text-align:center;padding:.75rem;">검색 결과가 없어요</div>';
  } else {
    shown.forEach(function(c){
      var on=picked.indexOf(c.id)>=0;
      var exposed=!!mStats[c.id];
      h+='<label style="display:flex;align-items:center;gap:8px;padding:.3rem .4rem;border-radius:0;cursor:pointer;'+(on?'background:var(--prl);':'')+'">'+

      '</label>';

// 루틴 카드 노출 통계 (몇 회, 언제) - 내 현황 / 전체현황 공용
function rRoutineCardStatsHtml(sid,mid,deck){
  if(!deck)return '';
  var stats=rtnCardStats(sid,mid);
  var cards=deck.cards||[];
  var rows=cards.filter(function(c){return stats[c.id];}).map(function(c){
    return{name:c.name,count:stats[c.id].count,dates:stats[c.id].dates};
  }).sort(function(a,b){return b.count-a.count||a.name.localeCompare(b.name);});
  var h='<div style="margin-top:10px;padding-top:10px;border-top:1px solid #D3DFDA;">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--pr);margin-bottom:6px;">🗂️ '+esc(deck.name)+' 노출 통계 · '+rows.length+'/'+cards.length+'장</div>';
  if(!rows.length){
    h+='<div style="font-size:12px;color:var(--mu);text-align:center;padding:.5rem;">아직 노출한 카드가 없어요</div>';
  } else {
    h+='<div style="max-height:220px;overflow-y:auto;border:1px solid #D3DFDA;border-radius:0;padding:.3rem .5rem;">';
    rows.forEach(function(r){
      var dstr=r.dates.map(function(d){var p=d.split('-');return (+p[1])+'/'+(+p[2]);}).join(', ');
      h+='<div style="padding:.3rem 0;border-bottom:1px solid #F9F9F9;">';
      h+='<div style="display:flex;align-items:center;gap:6px;"><span style="flex:1;font-size:12px;font-weight:600;color:var(--tx);">'+esc(r.name)+'</span><span style="font-size:11px;font-weight:700;color:var(--pr);white-space:nowrap;">'+r.count+'회</span></div>';
      h+='<div style="font-size:10px;color:var(--mu);margin-top:1px;">'+esc(dstr)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

// 밀린 주차: 이번 주 이전에 열린 주차 중 인증·휴가 표시가 없는 주 (루틴·종료 스터디 제외)
function kkOverdue(m){var out=[];if(!m)return out;
  S.studies.forEach(function(s){
    if(!s.active||(m.studyIds||[]).indexOf(s.id)<0||s.cat==='루틴 체크'||isStudyEnded(s))return;
    var cw=getCurrentWeek(s);if(cw<=1)return;
    var miss=allWeeks(s).filter(function(w){return w.num<cw&&!w.locked&&!ck(s.id,w.num,m.id);}).map(function(w){return w.num;});
    if(miss.length)out.push({sid:s.id,cat:s.cat,name:s.name,weeks:miss});});
  return out;}
function kkGoOverdue(){var m=S.isAdmin?curLoggedMember():S.loggedMember;var ov=kkOverdue(m);if(!ov.length)return;
  var co=S.catOrder||[];ov.sort(function(a,b){var ia=co.indexOf(a.cat),ib=co.indexOf(b.cat);ia=ia<0?999:ia;ib=ib<0?999:ib;if(ia!==ib)return ia-ib;try{return a.name.localeCompare(b.name,'ko');}catch(e){return 0;}});
  S.kkOvIdx=((S.kkOvIdx===undefined?-1:S.kkOvIdx)+1)%ov.length;var t=ov[S.kkOvIdx];
  if(S.expandedCat[t.cat]===false){S.expandedCat[t.cat]=true;render();}
  var el=document.getElementById('kkci-'+t.sid);if(!el)return;
  var y=el.getBoundingClientRect().top+window.pageYOffset-80;window.scrollTo({top:y,behavior:'smooth'});
  document.querySelectorAll('.kk-flash').forEach(function(x){x.classList.remove('kk-flash');});void el.offsetWidth;el.classList.add('kk-flash');
  if(ov.length>1)showToast('⏰ '+t.name+' · 밀린 '+t.weeks.length+'주 ('+(S.kkOvIdx+1)+'/'+ov.length+')','info');}
function rCI(){
  var m;
  if(S.isAdmin){
    m=S.members.filter(function(x){return x.name&&x.name.indexOf('강둥맘')>=0;})[0];
    if(!m)return '<div class="sec" style="text-align:center;font-size:14px;color:var(--mu);">강둥맘 멤버를 찾을 수 없어요</div>';
  } else {
    if(!S.loggedMember)return rML();
    m=S.loggedMember;
  }
  var my=S.studies.filter(function(s){return s.active&&(m.studyIds||[]).indexOf(s.id)>=0;});
  if(S.ciDetail){
    var sdS=my.filter(function(x){return x.id===S.ciDetail;})[0];
    if(sdS)return rStudyDetail(sdS,m);
    S.ciDetail=null;
  }
  var st=mCurSt(m);
  var ciTot=mTotSt(m);
  var ciBadges=getMemberBadges(m);
  var ciG=ciBadges.filter(function(b){return b.badge.badge==='🥇';}).length;
  var ciS=ciBadges.filter(function(b){return b.badge.badge==='🥈';}).length;
  var ciD=ciBadges.filter(function(b){return b.badge.badge==='💎';}).length;
  var ciMedalStr=(ciG||ciS||ciD)?('🥇'+ciG+' 🥈'+ciS+' 💎'+ciD):'-';
  var h='<div class="stack"><div class="sec">'+
    '<div class="rb" style="margin-bottom:10px;">'+
    '<div><div style="font-size:15px;font-weight:700;">'+esc(m.name)+'님 👋</div>'+
    '<div style="font-size:12px;color:var(--mu);margin-top:2px;">이번주 ✅'+st.done+' / 열린주차 '+st.total+'개</div></div>'+

function impArr(x){return Array.isArray(x)?x.filter(Boolean):(x?Object.values(x).filter(Boolean):[]);}
function impBuildPlan(raw,pairs){
  var V=raw.vip||{},N=raw.nw||{},cl=function(o){return JSON.parse(JSON.stringify(o));};
  var rep={autoMerged:[],manualMerged:[],newOnly:[],sidRenamed:0,midRenamed:0,ckV:0,ckN:0,ckSkipped:0,ckConflict:0};
  // 스터디
  var vS=impArr(V.studies).map(cl),nS=impArr(N.studies).map(cl);
  var used={};vS.forEach(function(s){used[s.id]=1;});
  var sidMap={};
  nS.forEach(function(s){var nid=s.id;if(used[nid]){nid='n_'+s.id;while(used[nid])nid+='x';rep.sidRenamed++;}used[nid]=1;sidMap[s.id]=nid;});
  vS.forEach(function(s){if(!s.tiers)s.tiers=['vip','clover'];});
  nS.forEach(function(s){
    s.id=sidMap[s.id];s.tiers=['new'];
    if(s.routineDeckId&&s.routineDeckId.indexOf('__')>0){var p=s.routineDeckId.split('__');if(sidMap[p[0]])p[0]=sidMap[p[0]];s.routineDeckId=p.join('__');}
  });
  // 멤버
  var vM=impArr(V.members).map(cl),nM=impArr(N.members).map(cl);
  var vById={},vByNick={},usedM={};
  vM.forEach(function(m){m.tier=m.tier||'vip';vById[m.id]=m;vByNick[nickNorm(m.name)]=m;usedM[m.id]=1;});
  var midMap={},outNew=[];
  nM.forEach(function(m){
    var origId=m.id,target=null,how='';
    if(pairs[m.id]!==undefined){if(pairs[m.id])target=vById[pairs[m.id]];how='manual';}
    else{target=vByNick[nickNorm(m.name)]||null;how='auto';}
    var sids=(m.studyIds||[]).map(function(x){return sidMap[x];}).filter(Boolean);
    if(target){
      midMap[m.id]=target.id;
      target.studyIds=target.studyIds||[];
      sids.forEach(function(x){if(target.studyIds.indexOf(x)<0)target.studyIds.push(x);});
      (how==='auto'?rep.autoMerged:rep.manualMerged).push({nw:m.name,vip:target.name,nid:m.id});
    }else{
      var nid=m.id;if(usedM[nid]){nid='n_'+m.id;while(usedM[nid])nid+='x';rep.midRenamed++;}usedM[nid]=1;
      midMap[m.id]=nid;m.id=nid;m.tier='new';m.studyIds=sids;outNew.push(m);
      rep.newOnly.push({nw:m.name,nid:origId});
    }
  });
  var members=vM.concat(outNew);
  var usedL={};
  members.forEach(function(m){
    var base=m.loginId||m.name||m.id,l=base,k=2;
    while(usedL[idNorm(l)]){l=base+'_'+k;k++;}
    if(l!==base)rep.idRenamed=(rep.idRenamed||[]).concat([m.name+' → '+l]);
    usedL[idNorm(l)]=1;m.loginId=l;
  });
  // 인증 기록 (키 형식: 스터디id__...__멤버id)
  var ck={};
  Object.keys(V.checkins||{}).forEach(function(k){ck[k]=V.checkins[k];rep.ckV++;});
  Object.keys(N.checkins||{}).forEach(function(k){
    var p=k.split('__');if(p.length<3){rep.ckSkipped++;return;}
    var sid=sidMap[p[0]],mid=midMap[p[p.length-1]];
    if(!sid||!mid){rep.ckSkipped++;return;}
    p[0]=sid;p[p.length-1]=mid;var nk=p.join('__');
    if(ck[nk]!==undefined){rep.ckConflict++;return;}
    ck[nk]=N.checkins[k];rep.ckN++;
  });
  // 카테고리 순서 / 휴강주
  var catOrder=(V.catOrder||[]).slice();(N.catOrder||[]).forEach(function(c){if(catOrder.indexOf(c)<0)catOrder.push(c);});
  var sw=impArr(V.skipWeeks).map(cl);
  impArr(N.skipWeeks).forEach(function(x){if(!sw.some(function(y){return y.id===x.id||(y.startDate===x.startDate&&y.endDate===x.endDate);}))sw.push(cl(x));});
  // 일정 / 공지
  var tagMerge=function(a,b,ta,tb){
    var out={};
    Object.keys(a||{}).forEach(function(k){var o=cl(a[k]);if(!o.tiers)o.tiers=ta;out[k]=o;});
    Object.keys(b||{}).forEach(function(k){var o=cl(b[k]);o.tiers=tb;var nk=k;while(out[nk])nk='n_'+nk;o.id=nk;out[nk]=o;});
    return out;
  };
  var events=tagMerge(V.events,N.events,['vip','clover'],['new']);
  var notices=tagMerge(raw.vipNotices,raw.nwNotices,['vip','clover'],['new']);
  return{studies:vS.concat(nS),members:members,checkins:ck,catOrder:catOrder,skipWeeks:sw,events:events,notices:notices,report:rep,
    counts:{vS:vS.length,nS:nS.length,vM:vM.length,nM:nM.length,ev:Object.keys(events).length,nt:Object.keys(notices).length}};
}

  var blob=new Blob([JSON.stringify({savedAt:d.toISOString(),legacy:S.imp.raw,current:{studies:S.studies,members:S.members,checkins:S.checkins,catOrder:S.catOrder,events:S.events,skipWeeks:S.skipWeeks,signups:S.signups,notices:S.notices}})],{type:'application/json'});

        '</div>'+
        '<div style="margin-top:6px;">'+tierPickHtml('ev')+'</div>'+
      '</div></div>';
  }

  h+='<div style="background:var(--wh);border:1.5px solid #D3DFDA;border-radius:var(--r);overflow:hidden;">';

    h+='<div style="text-align:center;padding:.5rem 0;font-size:12px;font-weight:700;color:'+(i===0?'var(--rd)':i===6?'var(--bl)':'var(--tx)')+';">'+d+'</div>';
  });

    var dayEvs=Object.values(S.events).filter(visibleToMe).filter(function(e){
      var s=e.startDate||e.date;var en=e.endDate||s;

  var moEvs=Object.values(S.events).filter(visibleToMe).filter(function(e){
    var s=e.startDate||e.date;var en=e.endDate||s;
    return s.startsWith(moPrefix)||en.startsWith(moPrefix)||(s<moPrefix&&en>moPrefix+'-31');
  }).sort(function(a,b){var sa=a.startDate||a.date;var sb=b.startDate||b.date;return sa>sb?1:-1;});

      '</div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

function bRows(){

    ss.forEach(function(s){
      var aw=allWeeks(s);var wks=S.rptWeek?aw.filter(function(w){return w.num===+S.rptWeek;}):aw;
      wks.forEach(function(w){
        S.members.filter(function(m){return(m.studyIds||[]).indexOf(s.id)>=0;}).forEach(function(m){
          rows.push({mem:m.name,mid:m.id,study:s.name,sid:s.id,cat:s.cat,week:w.num,tw:aw.length,locked:w.locked,st:ck(s.id,w.num,m.id)});
        });
      });
    });
  } else {
    var ms=S.rptMid?S.members.filter(function(m){return m.id===S.rptMid;}):S.members;
    ms.forEach(function(m){
      S.studies.filter(function(s){return s.active&&(m.studyIds||[]).indexOf(s.id)>=0;}).forEach(function(s){
        allWeeks(s).forEach(function(w){
          rows.push({mem:m.name,mid:m.id,study:s.name,sid:s.id,cat:s.cat,week:w.num,tw:allWeeks(s).length,locked:w.locked,st:ck(s.id,w.num,m.id)});
        });
      });
    });

  return rows;
}

function xCsv(){
  var rows=bRows();var lines=[['멤버','스터디','카테고리','주차','총주차','잠금','상태'].join(',')];
  rows.forEach(function(r){

  });

  a.download='스터디인증.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// 내가 불러온 뒤 바꾼 항목만 내 것으로, 나머지는 서버 최신 것으로 합침 (추가·삭제도 구분)
function kkMergeList(local,server,base){
  var L={},Sv={},out=[],seen={};
  local.forEach(function(x){if(x&&x.id)L[x.id]=x;});server.forEach(function(x){if(x&&x.id)Sv[x.id]=x;});
  var pick=function(id){
    var l=L[id],sv=Sv[id],inB=base[id]!==undefined;
    if(l&&sv)return (inB&&JSON.stringify(l)===base[id])?sv:l;
    if(l&&!sv)return inB?null:l;          // 서버에서 지워진 것 → 지움 / 내가 새로 추가 → 유지
    if(!l&&sv)return inB?null:sv;         // 내가 지운 것 → 지움 / 다른 사람이 추가 → 유지
    return null;
  };
  server.concat(local).forEach(function(x){if(!x||!x.id||seen[x.id])return;seen[x.id]=1;var v=pick(x.id);if(v)out.push(v);});
  return out;
}

    var cur=await fetch(FIREBASE_URL+DB_PATH.replace('.json','/members.json')).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
    var srvM=kkArr(cur);
    var mem=srvM.length?kkMergeList(S.members||[],srvM,base.m):(S.members||[]); // 서버가 비어 있으면(오류 등) 아무것도 지우지 않음
    var body={members:mem};
    if(S.isAdmin){
      var cs=await fetch(FIREBASE_URL+DB_PATH.replace('.json','/studies.json')).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
      var srvS=kkArr(cs);
      body.studies=srvS.length?kkMergeList(S.studies||[],srvS,base.s):(S.studies||[]);
      body.catOrder=S.catOrder;body.events=S.events;body.skipWeeks=S.skipWeeks;
    }
    await fetch(FIREBASE_URL+DB_PATH,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error(r.status);});
    var lm=S.loggedMember&&S.loggedMember.id;
    S.members=mem.slice().sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return 0;}});
    if(body.studies){S.studies=body.studies;S.studies.forEach(function(s){
      if(!s.weeks||!s.weeks.length)s.weeks=[{num:1,locked:false,materialUrl:''}];
      if(s.applyOpen===undefined)s.applyOpen=false;if(s.dayOfWeek===undefined)s.dayOfWeek='';if(s.bandUrl===undefined)s.bandUrl='';if(s.startDate===undefined)s.startDate='';
      if(!s.snotices)s.snotices=[];if(!s.cardDecks)s.cardDecks=[];s.cardDecks.forEach(function(cd){if(!cd.cards)cd.cards=[];});
      s.weeks.forEach(function(w){if(w.materialUrl===undefined)w.materialUrl='';if(w.note===undefined)w.note='';});});}
    kkSetBase();
    if(lm){var nm=S.members.filter(function(x){return x.id===lm;})[0];if(nm)S.loggedMember=nm;}
  }
  catch(e){alert('저장 실패. 인터넷 연결을 확인해주세요.');}
  S.saving=false;render();
}
async function persistNotices(){
  try{await fbSaveNotices(S.notices);}
  catch(e){alert('공지 저장 실패. 인터넷 연결을 확인해주세요.');}
  render();
}
function applyData(d){
  try{return kkApplyData0(d);}finally{kkSetBase();}
}
function kkApplyData0(d){
  S.studies=d&&d.studies&&d.studies.length?d.studies:JSON.parse(JSON.stringify(DEFAULT_STUDIES));
  var dbMems=d&&d.members&&d.members.length?d.members:[];
  if(dbMems.length){
    var exIds=dbMems.map(function(m){return m.id;});var exNames=dbMems.map(function(m){return m.name;});
    DEFAULT_MEMBERS.forEach(function(dm){if(exIds.indexOf(dm.id)<0&&exNames.indexOf(dm.name)<0)dbMems.push(JSON.parse(JSON.stringify(dm)));});
    S.members=dbMems;
  } else {S.members=JSON.parse(JSON.stringify(DEFAULT_MEMBERS));}
  S.checkins=d&&d.checkins?d.checkins:{};
  S.signups=d&&d.signups?d.signups:{};S.kkResets=d&&d.pwresets?d.pwresets:{};
  S.studies.forEach(function(s){
    if(!s.weeks||!s.weeks.length)s.weeks=[{num:1,locked:false,materialUrl:''}];
    if(s.applyOpen===undefined)s.applyOpen=false;
    if(s.dayOfWeek===undefined)s.dayOfWeek='';
    if(s.bandUrl===undefined)s.bandUrl='';
    if(s.startDate===undefined)s.startDate='';
    if(!s.snotices)s.snotices=[];
    if(!s.cardDecks)s.cardDecks=[];
    s.cardDecks.forEach(function(cd){if(!cd.cards)cd.cards=[];});
    s.weeks.forEach(function(w){if(w.materialUrl===undefined)w.materialUrl='';if(w.note===undefined)w.note='';});
  });
  // catOrder: Firebase에 저장된 순서 로드, 없으면 studies에서 추출
  var allCats=[];S.studies.forEach(function(s){if(allCats.indexOf(s.cat)<0)allCats.push(s.cat);});
  var savedOrder=d&&d.catOrder&&d.catOrder.length?d.catOrder:[];
  // 저장된 순서 기준으로 정렬, 새 카테고리는 맨 뒤에 추가
  S.events=d&&d.events?d.events:{};
  S.skipWeeks=d&&d.skipWeeks?d.skipWeeks:[];
  // 루틴 체크 카테고리 항상 포함
  if(allCats.indexOf('루틴 체크')<0)allCats.unshift('루틴 체크');
  S.catOrder=savedOrder.filter(function(c){return allCats.indexOf(c)>=0;});
  allCats.forEach(function(c){if(S.catOrder.indexOf(c)<0)S.catOrder.push(c);});
  // 루틴 체크가 catOrder에 없으면 맨 앞에 추가
  if(S.catOrder.indexOf('루틴 체크')<0)S.catOrder.unshift('루틴 체크');
  S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return a.name<b.name?-1:a.name>b.name?1:0;}});
  // 자동 로그인: 이 기기에서 마지막으로 로그인했던 멤버가 있으면 비번 없이 바로 로그인
  try{
    var savedMid=localStorage.getItem('kkang_member_id');
    if(savedMid){
      var savedM=S.members.filter(function(x){return x.id===savedMid;})[0];
      if(savedM){
        S.loggedMember=savedM;
        var lt=localStorage.getItem('kkang_last_tab');
        S.tab=(lt&&['ci','mp','apply','notice','cal','cp'].indexOf(lt)>=0)?lt:'ci';
      } else {
        localStorage.removeItem('kkang_member_id');S.home=true;
      }
    }
  }catch(e){}
  try{if(localStorage.getItem('kkang_admin')==='1'){
    if(S.loggedMember&&kkIsAdminMember(S.loggedMember)){S.kkAdminMid=S.loggedMember.id;S.loggedMember=null;S.isAdmin=true;S.home=false;S.tab='overall';}
    else if(!S.loggedMember){S.isAdmin=true;S.home=false;S.tab='overall';}
  }}catch(e){}
  S.loading=false;render();
}
(async function(){
  render();
  var coreData=null;
  try{coreData=await fbLoad();}
  catch(e1){
    // 1회 재시도
    try{await new Promise(function(r){setTimeout(r,1500);});coreData=await fbLoad();}
    catch(e2){
      S.loading=false;
      var app=document.getElementById('app');
      if(app)app.innerHTML='<div class="loading">로드 실패. 인터넷 연결을 확인하고 새로고침해주세요.<br><br><button onclick="location.reload()" style="padding:.6rem 1.25rem;border-radius:0;background:var(--pr);color:#fff;border:none;font-weight:700;cursor:pointer;">새로고침</button></div>';
      return;
    }
  }
  applyData(coreData);
  // 공지(이미지 포함)는 별도 경로에서 비동기로, 실패해도 앱은 정상 작동
  fbLoadNotices().then(function(nd){S.notices=nd||{};render();}).catch(function(){S.notices={};});
})();


</script>
