.hd-sub{margin-top:6px;font-size:12px;opacity:.8}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;margin-top:2px}
.hd-user{background:rgba(255,255,255,.25);border-radius:0;padding:3px 10px;font-size:12px;font-weight:600}
.hd-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:0;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem;padding-bottom:2px}
.tab{flex:0 0 auto;padding:.45rem .75rem;border-radius:0;border:1.5px solid var(--br);background:var(--wh);color:var(--mu);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pr);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 2px 10px transparent}
.tab.at{border-color:#D6E2EA;color:var(--bl)}
.tab.at.on{background:var(--bl);color:#fff;border-color:transparent}
.card{background:var(--wh);border:1.5px solid #D3DFDA;border-radius:0;padding:.75rem 1rem;box-shadow:0 2px 12px transparent}
.sec{background:var(--prl);border-radius:0;padding:1rem 1.125rem;border:1.5px solid #D3DFDA}
.stack{display:flex;flex-direction:column;gap:10px}
.rb{display:flex;align-items:center;justify-content:space-between}
.pb{height:10px;background:#EEF4F1;border-radius:0;overflow:hidden;margin:8px 0 3px}
.pb-f{height:100%;border-radius:0;transition:width .5s;background:var(--pr)}
.bd{font-size:11px;padding:3px 9px;border-radius:0;background:var(--grb);color:#16A34A;font-weight:700;white-space:nowrap;border:1px solid #BBF7D0}
.bv{font-size:11px;padding:3px 9px;border-radius:0;background:var(--bll);color:var(--bld);font-weight:700;white-space:nowrap;border:1px solid #BFDBFE}
.bw{font-size:11px;padding:3px 9px;border-radius:0;background:var(--orb);color:#D97706;white-space:nowrap;border:1px solid #FDE68A}
.wbdg{font-size:11px;padding:2px 8px;border-radius:0;background:var(--prl);color:var(--pr);font-weight:700;border:1px solid var(--br)}
.sbtn{font-size:12px;padding:6px 11px;border-radius:0;border:1.5px solid var(--br);background:var(--wh);cursor:pointer;color:var(--mu);font-weight:500}
.sbtn.done{background:var(--grb);border-color:#BBF7D0;color:#16A34A;font-weight:700}
.sbtn.vac{background:var(--bll);border-color:#BFDBFE;color:var(--bld);font-weight:700}
.ir{display:flex;gap:8px;margin-bottom:10px}
.ir input,.ainp{flex:1;padding:.65rem .875rem;border-radius:0;border:1.5px solid var(--br);font-size:14px;background:var(--wh);color:var(--tx)}
.ir input:focus,.ainp:focus{outline:none;border-color:var(--pr)}
.abtn{padding:.6rem 1rem;border-radius:0;background:var(--pr);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.abtn.sec{background:var(--bgd);color:var(--pr);border:1.5px solid var(--br)}
.abtn.full{width:100%;padding:.875rem;border-radius:0;font-size:15px}
.abtn.sm{padding:.4rem .75rem;font-size:12px;border-radius:0}
.st{font-size:14px;font-weight:700;margin-bottom:10px}
.dlb{background:none;border:none;cursor:pointer;color:#D3DFDA;font-size:16px;padding:0 2px}
.actb{font-size:12px;padding:4px 10px;border-radius:0;border:1.5px solid var(--bl);background:var(--bll);cursor:pointer;color:var(--bl);font-weight:600}
.ws{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--br);background:var(--wh);cursor:pointer;font-size:16px;color:var(--pr);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.stog{display:flex;align-items:center;justify-content:space-between;padding:.55rem .875rem;border-radius:0;background:var(--wh);font-size:13px;margin-bottom:5px;border:1.5px solid #D3DFDA}
.tgl{width:40px;height:22px;border-radius:11px;border:none;cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl.on{background:var(--pr)}.tgl.off{background:#E5E7EB}
.tgl.sm{width:34px;height:18px}
.sc-label{display:flex;align-items:center;gap:8px;padding:.45rem .5rem;font-size:13px;cursor:pointer;border-radius:0}
.sc-label:hover{background:var(--prl)}
.sc-label input{width:16px;height:16px;cursor:pointer;accent-color:var(--pr)}
.cat-hd{font-size:11px;font-weight:700;color:var(--pr);letter-spacing:.05em;padding:.4rem 0 .2rem}
.mexp{border:1.5px solid #D3DFDA;border-radius:0;overflow:hidden;margin-top:4px}
.mexp-hd{background:var(--prl);padding:.65rem 1rem;font-size:13px;font-weight:700;color:var(--pr)}
.mexp-body{padding:.5rem 1rem 1rem}
select{width:100%;padding:.65rem .875rem;border-radius:0;border:1.5px solid var(--br);font-size:14px;background:var(--wh);color:var(--tx)}
select:focus{outline:none;border-color:var(--pr)}
.loading{text-align:center;padding:3rem 1rem;color:var(--mu);font-size:14px}
.sp{width:30px;height:30px;border:3px solid #EEF4F1;border-top-color:var(--pr);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mu);font-size:14px;padding:1.5rem 0}
.login-wrap{padding:.5rem 0}
.login-box{background:var(--wh);border:1.5px solid var(--br);border-radius:0;padding:1.5rem;max-width:380px;margin:0 auto;box-shadow:0 2px 16px transparent}
.login-box h2{font-size:17px;text-align:center;margin-bottom:4px;font-weight:700}
.login-box p{font-size:13px;color:var(--mu);text-align:center;margin-bottom:1.25rem;line-height:1.6}
.lstack{display:flex;flex-direction:column;gap:10px}
.err{font-size:13px;color:var(--pr);text-align:center}
.ok{font-size:13px;color:var(--gr);text-align:center;font-weight:600}
.stat-box{flex:1;text-align:center;background:var(--wh);border-radius:0;padding:.875rem .5rem;border:1.5px solid #D3DFDA}
.stat-num{font-size:22px;font-weight:700;margin-top:4px}
.stat-label{font-size:11px;color:var(--mu);font-weight:500}
.fbox{background:var(--wh);border:1.5px solid #D3DFDA;border-radius:0;padding:1rem}
.fg{flex:1;min-width:120px}
.fg label{font-size:11px;color:var(--mu);display:block;margin-bottom:4px;font-weight:600}
.rsum{display:flex;gap:6px;margin-bottom:8px}
.rsbox{flex:1;text-align:center;background:var(--prl);border-radius:0;padding:.5rem .25rem;border:1px solid var(--br)}
.rsnum{font-size:18px;font-weight:700}.rslbl{font-size:10px;color:var(--mu)}
.rtable{width:100%;border-collapse:collapse;font-size:12px}
.rtable th{background:var(--prl);color:var(--pr);font-weight:700;padding:.45rem .6rem;text-align:left;border-bottom:1.5px solid var(--br);white-space:nowrap}
.rtable td{padding:.4rem .6rem;border-bottom:1px solid #EEF2EF;vertical-align:middle}
.rtable tr:last-child td{border-bottom:none}
.tscroll{overflow-x:auto;border-radius:0;border:1.5px solid #D3DFDA;max-height:400px;overflow-y:auto}
.mprog{background:var(--wh);border:1.5px solid #D3DFDA;border-radius:0;padding:.875rem 1rem;cursor:pointer}
.mprog:hover{border-color:var(--pr)}
.wk-chip{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:0;font-weight:600;white-space:nowrap;border:1.5px solid transparent}
.wk-open{background:var(--prl);color:var(--pr);border-color:var(--pr)}
.wk-locked{background:#F3F4F6;color:var(--mu);border-color:#E5E7EB}
.lock-btn{font-size:11px;padding:3px 8px;border-radius:0;border:1.5px solid;cursor:pointer;font-weight:600}
.lock-btn.locked{background:#F3F4F6;color:var(--mu);border-color:#E5E7EB}
.lock-btn.open{background:var(--grb);color:var(--gr);border-color:#BBF7D0}
.add-wk-btn{font-size:12px;padding:4px 10px;border-radius:0;border:1.5px solid var(--pr);background:var(--prl);color:var(--pr);cursor:pointer;font-weight:600;white-space:nowrap}
.stab-btn{flex:0 0 auto;padding:.4rem .875rem;border-radius:0;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;border:1.5px solid var(--br);background:var(--wh);color:var(--mu)}
.stab-btn.on{border-color:var(--pr);background:var(--prl);color:var(--pr);font-weight:700}
.apply-card{background:var(--wh);border:1.5px solid #D3DFDA;border-radius:0;padding:.875rem 1rem}
.wk-curweek{background:var(--or)!important;color:#fff!important;border-color:transparent!important;font-weight:800!important;box-shadow:0 2px 10px rgba(245,158,11,.5)!important;animation:pulse-wk 1.5s ease-in-out infinite!important;}
@keyframes pulse-wk{0%,100%{box-shadow:0 2px 10px rgba(245,158,11,.4);}50%{box-shadow:0 2px 18px rgba(245,158,11,.8);}}
.scard{background:var(--wh);border:1.5px solid #D3DFDA;border-radius:0;overflow:hidden;transition:opacity .15s}
.scard.dragging{opacity:.4}
.scard.dragover{border-top:3px solid var(--pr)}
.drag-handle{font-size:18px;color:var(--mu);cursor:grab;flex-shrink:0;user-select:none}
.sinp-name{flex:1;font-size:13px;font-weight:600;border:none;background:transparent;outline:none;min-width:0;padding:2px 4px;border-radius:0;color:var(--tx)}
.sinp-name:focus{background:var(--prl)}/* 🎉 컨페티 애니메이션 */
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@keyframes pop-in{0%{transform:translate(-50%,-50%) scale(0);}60%{transform:translate(-50%,-50%) scale(1.2);}100%{transform:translate(-50%,-50%) scale(1);}}
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:9998;animation:confetti-fall 1.2s ease-in forwards;}
.ck-pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:52px;z-index:9999;pointer-events:none;animation:pop-in .4s cubic-bezier(.34,1.56,.64,1) forwards;}
/* 토스트 메시지 */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E1E2E;color:#fff;padding:10px 20px;border-radius:0;font-size:13px;font-weight:600;opacity:0;transition:all .35s ease;pointer-events:none;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.success{background:var(--gr);}
#toast.cancel{background:var(--rd);}
#toast.info{background:var(--pr);}

/* ── 스터디 상세 화면 ── */
.sd-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;background:var(--bg);padding:.5rem .25rem .6rem;margin:-.25rem 0 .25rem}
.sd-back{border:none;background:var(--wh);border:1.5px solid var(--br);color:var(--tx);width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sd-top-title{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-hero{background:var(--wh);border:1.5px solid var(--br);border-radius:0;padding:1rem 1.1rem;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.sd-cat{font-size:11px;font-weight:700;color:var(--pr);letter-spacing:.03em}
.sd-name{font-size:19px;font-weight:800;margin:3px 0 8px;line-height:1.3}
.sd-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.sd-chip{font-size:11px;font-weight:600;color:var(--pr);background:var(--prl);padding:3px 9px;border-radius:0}
.sd-prog{display:flex;align-items:flex-end;justify-content:space-between}
.sd-pct{font-size:26px;font-weight:800;line-height:1}
.sd-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sd-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#F3F4F6;color:var(--mu);border:2px solid transparent}
.sd-dot.done{background:var(--grb);color:#16A34A;border-color:#86EFAC}
.sd-dot.vac{background:var(--bll);color:var(--bld);border-color:#93C5FD}
.sd-dot.miss{background:var(--wh);color:var(--rd);border-color:#FCA5A5}
.sd-dot.cur{border-color:var(--or);box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.sd-now{background:var(--wh);border:2px solid var(--or);border-radius:0;padding:1rem 1.1rem;box-shadow:0 4px 16px rgba(245,158,11,.15)}
.sd-now-lbl{font-size:12px;font-weight:800;color:#D97706}
.sd-now-title{font-size:16px;font-weight:700;margin:4px 0 12px;line-height:1.4}
.sd-big{display:flex;gap:8px}
.sd-bbtn{flex:1;padding:.8rem .5rem;border-radius:0;border:1.5px solid var(--br);background:var(--wh);font-size:14px;font-weight:700;color:var(--tx);cursor:pointer}
.sd-bbtn.done{background:var(--gr);border-color:var(--gr);color:#fff}
.sd-bbtn.vac{background:var(--bl);border-color:var(--bl);color:#fff}
.sd-sec-t{font-size:13px;font-weight:800;margin:4px 2px 6px;color:var(--tx)}
.sd-list{background:var(--wh);border:1.5px solid var(--br);border-radius:0;overflow:hidden}
.sd-row{padding:.7rem .9rem;border-bottom:1px solid var(--br)}
.sd-row:last-child{border-bottom:none}
.sd-row.cur{background:#FFFBEB}
.sd-rhd{display:flex;align-items:center;gap:8px}
.sd-wn{font-size:11px;font-weight:800;color:var(--pr);background:var(--prl);border-radius:0;padding:3px 7px;flex-shrink:0}
.sd-row.cur .sd-wn{background:var(--or);color:#fff}
.sd-rt{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-ract{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.sd-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--bld);background:var(--bll);border:1.5px solid #BFDBFE;border-radius:0;padding:4px 11px;text-decoration:none}
.sd-lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mu);background:#F3F4F6;border-radius:0;padding:4px 11px}
.sd-note{font-size:12.5px;line-height:1.65;white-space:pre-wrap;background:var(--bg);border-radius:0;padding:.6rem .75rem;margin-top:7px}
.sd-ntog{border:none;background:none;color:var(--mu);font-size:12px;cursor:pointer;padding:2px 0;font-weight:600}
.sd-end{text-align:center;background:var(--wh);border:1.5px solid var(--br);border-radius:0;padding:1.5rem 1rem}
.sd-leave{display:block;margin:6px auto 0;border:none;background:none;color:var(--mu);font-size:12px;cursor:pointer;text-decoration:underline}

/* ── 하단 탭바 (인스타 스타일) ── */
body.has-nav{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:900;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--br);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bnav-in{max-width:520px;margin:0 auto;display:flex}
.bnav-b{flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:#9CA3AF;font-size:10.5px;font-weight:600;position:relative}
.bnav-b svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav-b.on{color:var(--tx);font-weight:800}
.bnav-b.on svg{stroke-width:2.4;stroke:var(--pr)}
.bnav-badge{position:absolute;top:0;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#EF4444;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.more-list{background:var(--wh);border:1.5px solid var(--br);border-radius:0;overflow:hidden}
.more-it{display:flex;align-items:center;gap:12px;width:100%;padding:.95rem 1.1rem;border:none;border-bottom:1px solid var(--br);background:none;cursor:pointer;font-size:15px;font-weight:600;color:var(--tx);text-align:left}
.more-it:last-child{border-bottom:none}
.more-it .mi-ic{font-size:20px;width:26px;text-align:center}
.more-it .mi-ar{margin-left:auto;color:var(--mu);font-size:18px}
.more-it.on{background:var(--prl)}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))!important}

/* ── 등급 / 가입 / 가져오기 ── */
.tchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:0;white-space:nowrap}
.tpick{display:flex;gap:6px;flex-wrap:wrap}
.tpick label{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border:1.5px solid var(--br);border-radius:0;cursor:pointer;background:var(--wh)}
.tpick input{accent-color:var(--pr);width:14px;height:14px}
.pend-card{background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:0;padding:.75rem .9rem}
.pend-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pend-btns button{font-size:12px;font-weight:700;padding:6px 12px;border-radius:0;border:1.5px solid var(--br);background:var(--wh);cursor:pointer}
.imp-box{background:var(--wh);border:1.5px solid var(--br);border-radius:0;padding:1rem}
.imp-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.imp-tbl th,.imp-tbl td{padding:.35rem .4rem;border-bottom:1px solid var(--br);text-align:left}
.imp-tbl th{color:var(--pr);font-weight:700}
.imp-warn{background:#FEF2F2;border:1.5px solid #FECACA;color:#B91C1C;border-radius:0;padding:.6rem .75rem;font-size:12.5px;line-height:1.55}

/* ═══ 홈페이지와 같은 디자인 (덮어쓰기) ═══ */
html,body{background:#FFFFFF;font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--tx);letter-spacing:-0.01em}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:560px;padding:0 20px 1rem}
.hd{background:#FFFFFF;color:var(--tx);border-radius:0;box-shadow:none;padding:14px 0;margin:0 0 20px;border-bottom:1px solid var(--br);align-items:center}
.hd-left{display:flex;flex-direction:column;gap:2px}
.hd-logo{display:block;border:none;background:none;padding:0;cursor:pointer;line-height:0}
.hd-logo img{display:block;height:20px;width:auto}
.hd-left .hd-title{font-size:12px;font-weight:500;color:var(--mu);letter-spacing:0}
.hd-right{flex-direction:row;align-items:center;gap:8px;margin-top:0}
.hd-user{background:var(--prl);color:var(--pr);border-radius:0;padding:4px 10px;font-size:12px;font-weight:600}
.kk-tierbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.kk-tl{font-size:12px;font-weight:600;color:var(--mu);margin-right:2px}
.kk-tf{border:1px solid var(--br);background:#FFFFFF;color:var(--tx);font-size:13px;font-weight:600;padding:7px 12px;cursor:pointer;font-family:inherit}
.kk-tf.on{background:var(--pr);border-color:var(--pr);color:#FFFFFF}
.kk-ovbox{cursor:pointer;font-family:inherit;border:1px solid var(--rd)!important;background:#FFF7F6!important}
.kk-ovgo{font-size:11px;font-weight:600;color:var(--rd);margin-top:2px}
.kk-ovchip{font-size:11px;font-weight:700;color:#FFFFFF;background:var(--rd);padding:2px 7px;white-space:nowrap}
@keyframes kkFlash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 3px var(--rd)}}
.kk-flash{animation:kkFlash 1.4s ease 2}
.kk-want{border:1px solid var(--br);padding:8px 10px;max-height:240px;overflow-y:auto;background:#FFFFFF}
.kk-want-cat{font-size:11.5px;font-weight:700;color:var(--pr);margin:6px 0 2px}
.kk-want-it{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0;cursor:pointer}
.kk-want-it input{width:17px;height:17px;accent-color:var(--pr);margin:0;flex:0 0 auto}
.kk-bd-head{padding:2px 2px 14px;border-bottom:2px solid var(--tx)}
.kk-bd-cat{font-size:12px;font-weight:600;color:var(--pr)}
.kk-bd-title{font-size:21px;font-weight:700;letter-spacing:-0.03em;margin:4px 0 6px;line-height:1.35}
.kk-bd-meta{font-size:12.5px;color:var(--mu);line-height:1.6}
.kk-bd-my{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;white-space:nowrap}
.kk-bd-bar{flex:1;height:6px;background:var(--prl)}.kk-bd-bar i{display:block;height:100%;background:var(--pr)}
.kk-bd-info{margin-top:12px;padding:12px 14px;background:var(--prl);font-size:13.5px;font-weight:600}
.kk-bd-cnt{font-size:13px;color:var(--mu);margin:16px 2px 6px}.kk-bd-cnt b{color:var(--pr)}
.kk-bd-list{border-top:1px solid var(--tx)}
.kk-bd-th,.kk-bd-row{display:grid;grid-template-columns:44px minmax(0,1fr) 62px;align-items:center;column-gap:6px}
.kk-bd-th{font-size:12px;color:var(--mu);padding:8px 0;background:#F7F9F8;border-bottom:1px solid var(--br);text-align:center}
.kk-bd-row{padding:12px 0;border-bottom:1px solid var(--br);cursor:pointer;font-size:14px;background:#FFFFFF}
.kk-bd-row.notice{background:#F7FAF8}.kk-bd-row.cur{background:#FFFBF2}.kk-bd-row.on .kk-bd-tt{color:var(--pr);font-weight:700}
.kk-bd-no{text-align:center;font-size:12.5px;color:var(--mu)}
.kk-bd-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--rd);border:1px solid var(--rd);padding:0 4px;line-height:1.5}
.kk-bd-t{min-width:0;display:flex;align-items:center;color:var(--tx)}
.kk-bd-tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kk-bd-new,.kk-bd-file{flex:0 0 auto}
.kk-bd-new{font-size:10.5px;font-weight:700;color:#FFFFFF;background:var(--or);padding:1px 5px;margin-left:6px;vertical-align:1px}
.kk-bd-file{font-size:10.5px;font-weight:600;color:var(--pr);border:1px solid var(--pr);padding:0 4px;margin-left:5px;vertical-align:1px}
.kk-bd-st{text-align:center;font-size:12px;font-weight:600}
.kk-bd-post{padding:16px 14px 18px;border-bottom:1px solid var(--br);background:#FFFFFF;box-shadow:inset 3px 0 0 var(--pr)}
.kk-bd-pt{font-size:16.5px;font-weight:700;line-height:1.45;letter-spacing:-0.02em}
.kk-bd-pm{font-size:12px;color:var(--mu);padding:4px 0 10px;border-bottom:1px solid var(--br);margin-bottom:12px}
.kk-bd-body{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.kk-bd-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.kk-bd-act .sd-big{flex:1 1 100%}
.kk-del{position:absolute;top:6px;right:8px;z-index:1;background:var(--rd);color:#FFFFFF;border:none;font-family:inherit;font-size:9.5px;font-weight:700;padding:2px 6px;line-height:1.4;cursor:pointer;white-space:nowrap}
.kk-del-lg{position:static;display:block;margin:10px auto 0;font-size:13.5px;padding:10px 18px;background:var(--rd);color:#FFFFFF;border:1px solid var(--rd)}
.kk-band{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12.5px;font-weight:700;color:#FFFFFF;background:#03C75A;padding:5px 12px;text-decoration:none;white-space:nowrap}
.kk-links{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;color:var(--mu)}
.kk-links a,.kk-linkbtn{color:var(--pr);font-weight:600;text-decoration:underline;text-underline-offset:4px;background:none;border:none;padding:4px 0;cursor:pointer;font-size:13px;font-family:inherit}
.kk-sub{font-size:14px;font-weight:700;color:var(--tx);margin:2px 2px -2px}
.kk-checks{display:flex;gap:18px;flex-wrap:wrap;padding:2px 2px 0}
.kk-hint{font-size:12px;color:var(--mu);margin:-4px 2px 2px}
.kk-auto{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer;padding:2px 2px 4px}
.kk-auto input{width:18px;height:18px;accent-color:var(--pr);margin:0}
.kk-auto span{font-size:12px;font-weight:400;color:var(--mu)}
.hd-switch{border:1px solid var(--pr);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.hd-switch .hd-sw{font-size:11px;font-weight:600;color:#FFFFFF;background:var(--pr);padding:2px 6px}
.hd-btn{background:#FFFFFF;border:1px solid var(--br);color:var(--tx);border-radius:0;padding:6px 12px;font-size:12px;font-weight:600}
.hd-btn#mlb{background:var(--pr);border-color:var(--pr);color:#FFFFFF}
.tab.on,.tab.at.on,.tgl.on{background:var(--pr);box-shadow:none}
.tab.at.on{background:var(--bl)}
.card,.fbox,.apply-card,.scard,.mprog,.stat-box,.stog,.imp-box,.sd-hero,.sd-list,.sd-end,.more-list,.login-box,.mexp,.tscroll{box-shadow:none;border-width:1px;border-color:var(--br)}
.sec{background:var(--prl);border:none}
.pb{background:var(--prl)}
.pb-f{background:var(--pr)}
.sp{border-color:var(--prl);border-top-color:var(--pr)}
.abtn{background:var(--pr);border:1px solid var(--pr);box-shadow:none}
.abtn.sec{background:#FFFFFF;color:var(--pr);border:1px solid var(--br)}
.abtn.full{border-radius:0}
.ir input,.ainp,select{border-width:1px;min-height:46px}
.login-wrap{padding:28px 0 8px}
.login-box{max-width:400px;padding:28px 24px}
.login-box h2{font-size:24px;font-weight:500;letter-spacing:-0.03em;margin-bottom:8px}
.login-box p{font-size:14px;color:var(--mu)}
.err{color:var(--rd)}
.dlb{color:var(--rd)}
.wk-curweek{background:var(--or)!important;box-shadow:none!important;animation:none!important}
#toast{border-radius:0;background:#333533}
#toast.success{background:var(--gr)}
#toast.cancel{background:var(--rd)}
#toast.info{background:var(--pr)}
.sd-top{background:#FFFFFF}
.sd-name{font-weight:600;letter-spacing:-0.03em}
.sd-pct{font-weight:600}
.sd-dot.cur{box-shadow:none}
.sd-now{box-shadow:none;border-width:1px}
.sd-bbtn{border-width:1px}
.sd-wn{border-radius:0}
.bnav{background:#FFFFFF;backdrop-filter:none;-webkit-backdrop-filter:none}
.bnav-b{color:var(--mu)}
.bnav-b.on{color:var(--pr);font-weight:700}
.more-it.on{background:var(--prl)}
.pend-card{border-width:1px}
</style>
</head>

t: 500; line-height: 1.16; letter-spacing: -0.035em; color: #333533\"><span style=\"display: block\">행운 같은 아이들과</span><span style=\"display: block\">행복하게 육아하기</span><span style=\"display: inline-block; margin-top: 0.22em; padding: 0.06em 0.3em 0.1em; background: #518474; color: #FFFFFF\">강둥이네에서 함께해요</span></p><p style=\"margin: 24px 0 0; font-size: 13px; line-height: 1.6; color: #6B706D\">네잎클로버는 행운 같은 아이들, 세잎클로버는 아이들과 함께하는 일상의 행복이에요.</p></div></div></section>\n<footer style=\"padding-left: {{sidePad}}; padding-right: {{sidePad}}\"><div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 20px; border-top: 1px solid #D3DFDA; padding: 22px 0 40px; font-size: 13px; color: #6B706D\"><div><img alt=\"강둥이네 kkangtwins\" src=\"__IMG_word__\" style=\"display: block; height: 18px; width: auto; aspect-ratio: 420 / 86\"/><p style=\"margin: 10px 0 0\">@kkang_twins_</p></div><div><button onclick=\"{{ go.about }}\" style=\"display: block; font-family: inherit; font-size: 13px; padding: 6px 0; border: none; background: none; color: #333533; cursor: pointer; text-align: left\" type=\"button\">강둥맘 소개</button><button onclick=\"{{ go.tips }}\" style=\"display: block; font-family: inherit; font-size: 13px; padding: 6px 0; border: none; background: none; color: #333533; cursor: pointer; text-align: left\" type=\"button\">책육아 꿀팁</button><button onclick=\"{{ go.umse }}\" style=\"display: block; font-family: inherit; font-size: 13px; padding: 6px 0; border: none; background: none; color: #333533; cursor: pointer; text-align: left\" type=\"button\">엄세스</button></div><div><button onclick=\"{{ go.studies }}\" style=\"display: block; font-family: inherit; font-size: 13px; padding: 6px 0; border: none; background: none; color: #333533; cursor: pointer; text-align: left\" type=\"button\">스터디 둘러보기</button><button onclick=\"{{ go.share }}\" style=\"display: block; font-family: inherit; font-size: 13px; padding: 6px 0; border: none; background: none; color: #333533; cursor: pointer; text-align: left\" type=\"button\">자료나눔</button><a href=\"https://open.kakao.com/o/s6Rv79vh\" style=\"display: inline-block; padding: 6px 0; color: #333533; text-decoration: underline; text-underline-offset: 4px\">카카오톡으로 문의하기</a></div></div></footer>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isAbout }}\">\n<main style=\"padding-left: {{sidePad}}; padding-right: {{sidePad}}; padding-top: 28px; padding-bottom: 80px\"><div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div>\n<div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 20px; border-top: 1px solid #D3DFDA; padding: 18px 0 34px\"><div><p style=\"margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: #333533\">강둥맘 이야기</p><h1 style=\"margin: 0; font-size: {{h2Size}}; font-weight: 500; line-height: 1.12; letter-spacing: -0.03em; color: #333533; margin-top: 22px\">안녕하세요<br/>강둥맘이에요</h1></div><div style=\"grid-column: {{span2}}; align-self: end\"><p style=\"margin: 0 0 14px; font-size: 19px; font-weight: 500; line-height: 1.7; color: #333533\">23년 4월생 남아 쌍둥이를 키우고 있는<br/>약대생 강둥맘입니다.</p><p style=\"margin: 0; display: inline-block; background: #518474; color: #FFFFFF; font-size: 16px; font-weight: 500; line-height: 1.6; padding: 10px 16px\">책과 교구를 사는 데 진심<br/>뽕뽑는 데는 더 진심.</p></div></div><div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 12px; border-top: 1px solid #D3DFDA; padding: 22px 0 30px\"><div><p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #518474\">왜 이렇게 스터디가 많을까?</p></div><div style=\"grid-column: {{span2}}\"><h2 style=\"margin: 0 0 14px; font-size: {{h3Size}}; font-weight: 500; line-height: 1.35; letter-spacing: -0.03em; color: #333533\">“이 사람은 왜 이렇게<br/>스터디를 많이 하지?”</h2><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">혹시 이렇게 생각하셨나요? ㅎㅎ<br/>궁금하신 분들도 계실 것 같아요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">사실 처음부터 누군가를 위해 만든 게 아니라<br/><b>제가 가진 것들을 ‘뽕뽑기’ 위해</b> 시작한 스터디였어요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">어떻게 하면 제대로 활용할 수 있을까 어떤 활동을 해야 할까 외워야 할까<br/>고민하다가 직접 스터디를 만들게 되었습니다.</p><p style=\"margin: 0 0 0px; font-size: 16px; line-height: 1.8; color: #333533\">그런데 하다 보니 ‘뽕뽑기’의 재미에 빠져<br/>자연스럽게 스터디가 늘어나게 되었어요 ㅎㅎ</p></div></div><div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 12px; border-top: 1px solid #D3DFDA; padding: 22px 0 30px\"><div><p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #518474\">엄가다에서 실천형 스터디로</p></div><div style=\"grid-column: {{span2}}\"><h2 style=\"margin: 0 0 14px; font-size: {{h3Size}}; font-weight: 500; line-height: 1.35; letter-spacing: -0.03em; color: #333533\">아이들을 위해서라면<br/>뭐든 해보는 스타일</h2><p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.8; color: #333533\">저는 엄가다도 두려워하지 않아요.</p><div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px\"><span style=\"display: inline-block; padding: 6px 10px; border: 1px solid #D3DFDA; background: #FFFFFF; font-size: 14px; color: #333533\">코팅기</span><span style=\"display: inline-block; padding: 6px 10px; border: 1px solid #D3DFDA; background: #FFFFFF; font-size: 14px; color: #333533\">무한잉크프린터</span><span style=\"display: inline-block; padding: 6px 10px; border: 1px solid #D3DFDA; background: #FFFFFF; font-size: 14px; color: #333533\">제단기</span><span style=\"display: inline-block; padding: 6px 10px; border: 1px solid #D3DFDA; background: #FFFFFF; font-size: 14px; color: #333533\">제본기</span><span style=\"display: inline-block; padding: 6px 10px; border: 1px solid #D3DFDA; background: #FFFFFF; font-size: 14px; color: #333533\">스캐너</span><span style=\"align-self: center; font-size: 14px; color: #6B706D\">까지 있어요</span></div><p style=\"margin: 0 0 0px; font-size: 16px; line-height: 1.8; color: #333533\">하지만 스터디를 하면서 <b>‘굳이 엄가다 없이도 뽕뽑는 방법’</b>을 찾게 되었고<br/>그게 지금의 <b>실천형 스터디</b>로 이어졌습니다.</p></div></div><div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 12px; border-top: 1px solid #D3DFDA; padding: 22px 0 30px\"><div><p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #518474\">뭐든 스터디로</p></div><div style=\"grid-column: {{span2}}\"><h2 style=\"margin: 0 0 14px; font-size: {{h3Size}}; font-weight: 500; line-height: 1.35; letter-spacing: -0.03em; color: #333533\">저는 뭐든 스터디로<br/>풀어내는 사람이에요</h2><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">약대 입시 준비와 면접 준비도 모두 스터디로 진행했고<br/>함께한 분들 대부분이 <b>약대와 치대에 합격</b>했어요.</p><p style=\"margin: 0 0 12px; font-size: 16px; line-height: 1.8; color: #333533\">그래서 저는 이런 스터디를 지향합니다.</p><div style=\"display: grid; grid-template-columns: {{cols2}}; gap: 10px\"><div style=\"padding: 16px 18px; background: #EEF4F1\"><p style=\"margin: 0; font-size: 17px; font-weight: 600; color: #518474\">윈윈하는 스터디</p></div><div style=\"padding: 16px 18px; background: #EEF4F1\"><p style=\"margin: 0; font-size: 17px; font-weight: 600; color: #518474\">함께 성장하는 스터디</p></div></div></div></div><div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 12px; border-top: 1px solid #D3DFDA; padding: 22px 0 30px\"><div><p style=\"margin: 0; font-size: 13px; font-weight: 600; color: #518474\">엄세스 스터디란?</p></div><div style=\"grid-column: {{span2}}\"><h2 style=\"margin: 0 0 14px; font-size: {{h3Size}}; font-weight: 500; line-height: 1.35; letter-spacing: -0.03em; color: #333533\">엄마가 세이펜이 되어<br/>언제 어디서든 영어 음원을</h2><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">‘엄세스’는 엄마가 세이펜이 되어<br/>언제 어디서든 영어 음원을 노출해주는 스터디입니다.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">저는 아이들에게 더 잘 노출해주고 싶어서<br/>전집 노래와 마더구스를 전부 외워 직접 불러줬어요.<br/>그러다 시작한 ‘녹음 스터디’가 생각보다 효과가 정말 좋았고<br/>그렇게 <b>‘녹음 인증 스터디’</b>가 만들어졌습니다.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">처음에는 내 목소리를 인증하는 게 조금 부끄럽지만<br/>그 과정 자체가 강력한 동기부여가 돼요.<br/>여러 번 반복하다 보면 결국 진짜 ‘뽕뽑기’를 하게 될 거예요.</p><p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.8; color: #333533\">녹음만으로도 이전과 달라진 나를 느낄 수 있어요.<br/>그래서 저는 모든 분들이 <b>끝까지 완주하는 것</b>을 목표로 합니다.</p><button onclick=\"{{ go.umse }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 0; min-height: 44px; border: none; background: none; color: #518474; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px\" type=\"button\">엄세스 자세히 보기</button></div></div>\n<div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 20px; margin-top: 56px; border-top: 1px solid #D3DFDA; padding-top: 24px\"><div><img alt=\"\" aria-hidden=\"true\" src=\"__IMG_clv__\" style=\"display: block; width: 84px; height: auto; aspect-ratio: 320 / 203\"/></div><div style=\"grid-column: {{span2}}\"><p style=\"margin: 0; font-size: {{h3Size}}; font-weight: 500; line-height: 1.3; letter-spacing: -0.025em; color: #333533\">행운 같은 아이들과 행복하게 육아하기<br/><span style=\"color: #518474\">강둥이네에서 함께해요</span></p><p style=\"margin: 14px 0 0; font-size: 13px; color: #6B706D\">세잎클로버는 아이와 함께하는 일상의 행복<br/>네잎클로버는 우리에게 찾아온 행운 같은 아이들이에요.</p></div></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isTips }}\">\n<main class=\"kk-txt\" style=\"max-width: 760px; margin: 0 auto; padding: 32px 20px 72px\">\n<div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div><p style=\"margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #518474\"><span aria-hidden=\"true\" style=\"display: inline-block; width: 18px; height: 1px; background: #518474\"></span>책육아 꿀팁</p><h1 style=\"margin: 0 0 16px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(30px, 5vw, 44px); font-weight: 500; line-height: 1.3; letter-spacing: -0.03em; color: #333533\">끝까지 읽는 것보다,<br/>한 번 더 즐겁게.</h1>\n<p style=\"margin: 0 0 26px; font-size: 17px; line-height: 1.7; color: #518474\">강둥이들과 직접 해온 책육아 뽕뽑는 꿀팁 4가지.</p>\n<p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">책육아를 하다 보면 책을 어떻게 읽어줘야 하는지,<br/>독후활동까지 꼭 해줘야 하는지 고민되실 거예요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">저는 책을 무조건 끝까지 읽어주기보다 아이의 개월수와 관심에 맞춰 <b>짧게라도<br/>자주 노출해주는 것</b>을 중요하게 생각했어요.</p><p style=\"margin: 0 0 28px; font-size: 16px; line-height: 1.8; color: #333533\">강둥이들을 키우면서<br/>실제로 해왔던 책육아 방법을 하나씩 소개해드릴게요 ❤️</p><article style=\"padding: 34px 0 30px; border-top: 1px solid #D3DFDA\"><p style=\"margin: 0 0 6px; font-size: 34px; line-height: 1; color: #518474\">01</p><h2 style=\"margin: 0 0 16px; font-size: 22px; font-weight: 500; line-height: 1.45; letter-spacing: -0.03em; color: #333533\">엄마가 세이펜 되기</h2><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">저는 책 음원과 마더구스를 자주 들으면서<br/>가능한 노래는 직접 외워서 불러주려고 했어요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">책을 펼쳤을 때만 음원을 들려주는 것이 아니라,<br/>책에서 봤던 장면을 일상에서 만날 때마다<br/>관련된 노래나 표현을 들려줬어요.</p><ul style=\"margin: 4px 0 18px; padding: 0; list-style: none; display: grid; gap: 8px\"><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>꽃을 보면 “킁킁킁” 노래 불러주기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>딸기를 보면 “Strawberries are Red” 불러주기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>버스를 보면 “The Wheels on the Bus” 불러주기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>다리를 건너며 “London Bridge” 불러주기</span></li></ul><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">이렇게 하면 책을 읽지 않는 시간에도 집안일을 하면서,<br/>산책하면서, 차로 이동하면서<br/>자연스럽게 책의 내용을 반복해서 노출할 수 있어요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">새로운 책을 계속 보여주는 것보다 좋아하는 책과 음원을 반복해주는 것도 중요해요.<br/>아이는 반복해서 들으면서<br/>책의 내용과 일상 속 경험을 자연스럽게 연결하거든요.</p><div style=\"margin: 6px 0 4px; padding: 14px 16px; background: #EEF4F1\"><p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #333533\"><b style=\"color: #518474\">💡 </b>꼭 음원을 완벽하게 외울 필요는 없어요.<br/>한 소절만 기억나도 괜찮고,<br/>음원을 틀어놓고 함께 따라 불러도 충분해요 ❤️</p></div></article><article style=\"padding: 34px 0 30px; border-top: 1px solid #D3DFDA\"><p style=\"margin: 0 0 6px; font-size: 34px; line-height: 1; color: #518474\">02</p><h2 style=\"margin: 0 0 16px; font-size: 22px; font-weight: 500; line-height: 1.45; letter-spacing: -0.03em; color: #333533\">아이가 놀아도 엄마 혼자 책 읽기</h2><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">책을 읽어주려고 했는데 아이가 다른 곳으로 가버리거나<br/>옆에서 장난감만 가지고 놀 때가 있잖아요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">그럴 때 억지로 앉히거나 “책 안 보면 이제 안 읽어줄 거야”라고<br/>하기보다 <b>엄마 혼자 재미있게 읽어보세요.</b></p><div style=\"margin: 4px 0 18px; padding: 14px 16px; border-left: 2px solid #518474; background: #FFFFFF; display: grid; gap: 6px\"><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #518474\">“어머! 이게 뭐야?”</p><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #518474\">“우와, 자동차가 엄청 빠르게 달려가네!”</p><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #518474\">“아이쿠! 넘어졌어!”</p></div><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">이렇게 정말 재미있는 책을 발견한 것처럼<br/>목소리와 표정을 과장해서 읽어주는 거예요.<br/>그러면 아이가 놀다가도 무슨 내용인지 궁금해서<br/>슬쩍 다가오기도 해요 🤣</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">끝까지 오지 않아도 괜찮아요.<br/>아이는 놀이하면서 엄마의 목소리를 듣고 있고,<br/>책과 친숙해지는 경험을 쌓고 있으니까요.</p><p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.8; color: #333533\">책을 아이 손이 닿는 곳에 두는 것도 도움이 됐어요.</p><ul style=\"margin: 4px 0 18px; padding: 0; list-style: none; display: grid; gap: 8px\"><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>자주 읽는 책은 바구니에 담아두기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>관심을 보이는 책은 전면책장에 세워두기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>며칠마다 책의 위치를 바꿔 새롭게 보이게 하기</span></li></ul><p style=\"margin: 0 0 0px; font-size: 16px; line-height: 1.8; color: #333533\">무조건 책장을 추가하기보다 집 안에서 아이의 눈에 책이 자주 보이도록 해주세요 ❤️</p></article><article style=\"padding: 34px 0 30px; border-top: 1px solid #D3DFDA\"><p style=\"margin: 0 0 6px; font-size: 34px; line-height: 1; color: #518474\">03</p><h2 style=\"margin: 0 0 16px; font-size: 22px; font-weight: 500; line-height: 1.45; letter-spacing: -0.03em; color: #333533\">끝까지 읽기보다 재미있게 읽기</h2><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">책은 처음부터 마지막 장까지 모든 글을 다 읽어야 한다고<br/>생각하기 쉽지만,<br/>저는 <b>아이가 좋아하는 한 페이지만 봐도 괜찮다</b>고 생각해요.</p><p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.8; color: #333533\">아이가 좋아하는 장면이 나오면<br/>그 장면을 충분히 보고 반복해서 즐겨주세요.</p><ul style=\"margin: 4px 0 18px; padding: 0; list-style: none; display: grid; gap: 8px\"><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>동물이 나오면 울음소리 내기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>등장인물이 뛰면 함께 뛰어보기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>음식이 나오면 먹는 시늉하기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>자동차가 나오면 몸으로 운전하는 흉내 내기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>책 속 표정을 함께 따라 해보기</span></li></ul><p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.8; color: #333533\">글을 그대로 읽어주는 것보다 의성어와 의태어를 많이 넣어주면 더 재미있어요.</p><div style=\"margin: 4px 0 18px; padding: 14px 16px; border-left: 2px solid #518474; background: #FFFFFF; display: grid; gap: 6px\"><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #518474\">“자동차가 부릉부릉 달려가네”</p><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #518474\">“비가 주룩주룩 내려요”</p><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #518474\">“토끼가 깡충깡충 뛰어가요”</p><p style=\"margin: 0; font-size: 15.5px; line-height: 1.6; color: #518474\">“사과를 아삭아삭 먹어볼까?”</p></div><p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.8; color: #333533\">독후활동도 거창하게 준비하지 않아도 돼요.<br/>책에서 본 것을 찾아보거나 몸으로 따라 하고,<br/>블록이나 장난감으로 다시 표현하는 것도 충분한 독후활동이에요.</p><ul style=\"margin: 4px 0 18px; padding: 0; list-style: none; display: grid; gap: 8px\"><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>과일책을 읽고 실제 과일 만져보기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>탈것책을 읽고 산책하며 자동차 찾아보기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>동물책을 읽고 동물처럼 움직여보기</span></li><li style=\"display: flex; gap: 10px; align-items: baseline; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; transform: translateY(-2px)\"></span><span>집에 관한 책을 읽고 블록으로 집 만들기</span></li></ul><div style=\"margin: 6px 0 4px; padding: 14px 16px; background: #EEF4F1\"><p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #333533\"><b style=\"color: #518474\">💡 </b>독후활동의 목적은 결과물을 완성하는 것이 아니라 책의 내용을 한 번 더 재미있게 경험하는 거예요 ❤️</p></div></article><article style=\"padding: 34px 0 30px; border-top: 1px solid #D3DFDA\"><p style=\"margin: 0 0 6px; font-size: 34px; line-height: 1; color: #518474\">04</p><h2 style=\"margin: 0 0 16px; font-size: 22px; font-weight: 500; line-height: 1.45; letter-spacing: -0.03em; color: #333533\">잠자리 독서를 루틴으로 만들기</h2><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">저희는 <b>10개월부터</b> 잠자리 독서를 시작했어요.</p><p style=\"margin: 0 0 18px; font-size: 16px; line-height: 1.8; color: #333533\">처음부터 침실에서 책을 읽은 것은 아니고,<br/>아이들의 성장과 생활 패턴에 맞춰 조금씩 독서 순서를 바꿔줬어요.</p><div style=\"display: grid; grid-template-columns: {{cols2}}; column-gap: 12px; row-gap: 12px; margin: 0 0 20px\"><div style=\"padding: 16px; background: #EEF4F1\"><p style=\"margin: 0 0 10px; font-size: 14px; font-weight: 700; color: #518474\">📌 18개월 이전</p><ol style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 6px\"><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #518474; color: #FFFFFF; font-weight: 600\">거실에서 책 읽기</li><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #FFFFFF; color: #333533; border: 1px solid #D3DFDA\">저녁 식사</li><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #FFFFFF; color: #333533; border: 1px solid #D3DFDA\">씻기</li><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #FFFFFF; color: #333533; border: 1px solid #D3DFDA\">잠자기</li></ol></div><div style=\"padding: 16px; background: #EEF4F1\"><p style=\"margin: 0 0 10px; font-size: 14px; font-weight: 700; color: #518474\">📌 18개월 이후</p><ol style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 6px\"><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #FFFFFF; color: #333533; border: 1px solid #D3DFDA\">저녁 식사</li><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #FFFFFF; color: #333533; border: 1px solid #D3DFDA\">씻기</li><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #518474; color: #FFFFFF; font-weight: 600\">침실에서 책 읽기</li><li style=\"padding: 10px 12px; font-size: 15px; line-height: 1.5; background: #FFFFFF; color: #333533; border: 1px solid #D3DFDA\">잠자기</li></ol></div></div><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">매일 같은 시간과 순서로 책을 읽다 보니 책 읽기가 잠들기 전 자연스러운 일과가 됐어요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">물론 매일 여러 권을 읽어줄 필요는 없어요.<br/>엄마가 너무 피곤한 날에는 짧은 책 한 권만 읽거나,<br/>불을 끄고 책 음원이나 마더구스를 불러줘도 괜찮아요.</p><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">중요한 것은 많이 읽어주는 것보다 <b>짧게라도 꾸준히 이어가는 것</b>이에요.</p><p style=\"margin: 0 0 0px; font-size: 16px; line-height: 1.8; color: #333533\">저희 아이들도 “자러 가자” 하면 싫어하지만 “책 읽으러 가자!”<br/>하면 침실로 달려가요 🤣</p></article><section style=\"margin: 8px 0 0; padding: 26px 22px; background: #EEF4F1\"><p style=\"margin: 0 0 14px\"><span style=\"display: inline-block; background: #518474; color: #FFFFFF; font-size: 16px; font-weight: 600; padding: 8px 14px\">강둥맘 책육아의 핵심</span></p><ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 10px\"><li style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.6; color: #333533\"><span aria-hidden=\"true\" style=\"color: #518474; font-weight: 700\">✓</span><span>끝까지 읽지 않아도 괜찮아요</span></li><li style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.6; color: #333533\"><span aria-hidden=\"true\" style=\"color: #518474; font-weight: 700\">✓</span><span>아이가 당장 집중하지 않아도 괜찮아요</span></li><li style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.6; color: #333533\"><span aria-hidden=\"true\" style=\"color: #518474; font-weight: 700\">✓</span><span>새로운 책보다 반복해서 보는 책도 중요해요</span></li><li style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.6; color: #333533\"><span aria-hidden=\"true\" style=\"color: #518474; font-weight: 700\">✓</span><span>독후활동은 놀이처럼 가볍게 해주세요</span></li><li style=\"display: flex; gap: 10px; font-size: 16px; line-height: 1.6; color: #333533\"><span aria-hidden=\"true\" style=\"color: #518474; font-weight: 700\">✓</span><span>엄마가 지치지 않는 방법으로 꾸준히 해주세요</span></li></ul></section><div style=\"padding: 28px 0 8px\"><p style=\"margin: 0 0 14px; font-size: 16px; line-height: 1.8; color: #333533\">저도 이 모든 걸 혼자 꾸준히 하지는 못했어요 🤣</p><p style=\"margin: 0 0 0px; font-size: 16px; line-height: 1.8; color: #333533\">여러 책육아 스터디에 참여하면서 책을 읽고<br/>독후활동까지 이어가는 습관을 만들었고,<br/>강둥이들의 개월수에 맞게 활동을 바꿔주면서<br/><b>지금의 스터디까지</b> 만들게 됐어요.</p></div><div style=\"margin-top: 20px; display: flex; justify-content: center\"><button class=\"kk-g\" onclick=\"{{ go.studies }}\" style=\"font-family: inherit; font-size: 16px; font-weight: 600; padding: 12px 26px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap\" type=\"button\">스터디 둘러보기 <span aria-hidden=\"true\">→</span></button></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isUmse }}\">\n<main class=\"kk-txt\" style=\"max-width: 760px; margin: 0 auto; padding: 32px 20px 72px\">\n<div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div><p style=\"margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #518474\"><span aria-hidden=\"true\" style=\"display: inline-block; width: 18px; height: 1px; background: #518474\"></span>엄세스</p><h1 style=\"margin: 0 0 16px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(30px, 5vw, 44px); font-weight: 500; line-height: 1.3; letter-spacing: -0.03em; color: #333533\">책을 덮어도,<br/>엄마의 노래는 계속돼요.</h1>\n<p style=\"margin: 0 0 8px; font-size: 17px; line-height: 1.7; color: #2E3430\">엄마가 세이펜이 되어 영어를 일상으로 이어가는 녹음 스터디.</p>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">엄세스란?</h2>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">엄세스는 ‘엄마가 세이펜’이 되어 책 속 영어 노래와 표현을 일상에서도 들려주는 스터디예요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">책을 펼칠 때뿐 아니라 산책하고, 차를 타고,<br/>함께 놀 때도 익숙한 노래 한 소절로 책과 일상을 연결해요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">제가 아이들에게 더 자주 들려주고 싶어<br/>전집 노래와 마더구스를 외워 부르면서 시작했고,<br/>그 과정이 녹음 인증 스터디로 이어졌어요.</p>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">어떻게 참여하나요?</h2>\n<ol style=\"margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 520px\"><li style=\"display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #EEF4F1; border-left: 3px solid #518474\"><span style=\"flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: #518474; color: #FFFFFF; font-size: 15px; font-weight: 700\">1</span><span style=\"font-size: 16px; font-weight: 600; line-height: 1.5; color: #333533\">음원 듣기</span></li><li style=\"display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #EEF4F1; border-left: 3px solid #518474\"><span style=\"flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: #518474; color: #FFFFFF; font-size: 15px; font-weight: 700\">2</span><span style=\"font-size: 16px; font-weight: 600; line-height: 1.5; color: #333533\">따라 부르기</span></li><li style=\"display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #EEF4F1; border-left: 3px solid #518474\"><span style=\"flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: #518474; color: #FFFFFF; font-size: 15px; font-weight: 700\">3</span><span style=\"font-size: 16px; font-weight: 600; line-height: 1.5; color: #333533\">내 목소리로 녹음하기</span></li><li style=\"display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #EEF4F1; border-left: 3px solid #518474\"><span style=\"flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: #518474; color: #FFFFFF; font-size: 15px; font-weight: 700\">4</span><span style=\"font-size: 16px; font-weight: 600; line-height: 1.5; color: #333533\">인증하기</span></li><li style=\"display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #EEF4F1; border-left: 3px solid #518474\"><span style=\"flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: #518474; color: #FFFFFF; font-size: 15px; font-weight: 700\">5</span><span style=\"font-size: 16px; font-weight: 600; line-height: 1.5; color: #333533\">일상에서 아이에게 들려주기</span></li></ol>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">처음부터 완벽하게 외우거나 노래를 잘 부를 필요는 없어요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">들으며 따라 부르고, 익숙해진 표현을 일상에서 하나씩 꺼내보세요.</p>\n<p style=\"margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #6B706D\">인증 일정과 분량, 제출 방식은 각 스터디의 실제 안내를 따라요.</p>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">어떤 종류가 있나요?</h2>\n<div style=\"border-top: 1px solid #D3DFDA\">\n<sc-for as=\"u\" hint-placeholder-count=\"6\" list=\"{{ umseTypes }}\">\n<div style=\"padding: 18px 2px; border-bottom: 1px solid #D3DFDA; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px\"><div style=\"flex: 1 1 260px; min-width: 0\"><p style=\"margin: 0 0 4px; font-size: 19px; font-weight: 600; color: #333533\">{{ u.name }}</p><p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #2E3430\">{{ u.info }}</p></div><sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ u.hasSample }}\"><button class=\"kk-g\" onclick=\"{{ u.sample }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 20px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap\" type=\"button\">자료 예시 보기</button></sc-if></div>\n</sc-for>\n</div>\n<h3 style=\"margin: 28px 0 8px; font-size: 17px; font-weight: 500; color: #333533\">현재 모집 중인 엄세스</h3>\n<sc-if hint-placeholder-val=\"{{ true }}\" value=\"{{ umseOpenNone }}\"><p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #6B706D\">모집이 확인된 스터디가 생기면 이곳에 신청 버튼과 함께 안내해요.</p></sc-if>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">엄세스를 통해 기대하는 변화</h2>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">①</span>엄마가 먼저 익숙해져요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">녹음을 준비하며 듣고<br/>따라 부르는 과정에서 노래와 표현을 반복하게 돼요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">음원을 켜야만 활용할 수 있던 상태에서 익숙한 한 소절을 직접 꺼내 부르는 방향으로 조금씩 나아가는 것이 목표예요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">②</span>책 밖에서도 활용할 기회가 생겨요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">버스를 보며 “The Wheels on the Bus”를 부르고,<br/>다리를 건너며 “London Bridge”를 부르는 것처럼<br/>책에서 만난 표현을 실제 장면과 연결해볼 수 있어요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">③</span>사놓은 음원과 책을 다시 활용하게 돼요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">매번 새로운 자료를 찾기보다 이미 가진 책과 음원을 반복해서<br/>사용하는 계기를 만들어줘요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">④</span>혼자 미루던 활용을 함께 이어가요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">녹음과 인증이라는 작은 목표가 오늘도 한 번 듣고<br/>불러보는 동기가 될 수 있어요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">강둥맘에게도 녹음 인증은 반복해서<br/>활용하는 데 도움이 된 방법이었어요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">⑤</span>아이에게 익숙한 노래와 표현을 쌓아가요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">일상에서 같은 노래와 표현을 다시 만나는 기회를 만들어줘요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">아이의 반응과 발화 시기는 다를 수 있으니 바로 따라 말하는지보다 즐겁게 함께하는 과정을 중요하게 생각해요.</p>\n</article>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">이런 분께 어울려요</h2>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.9; color: #333533\"><li>영어 전집과 음원을 샀지만 활용이 뜸한 분</li><li>엄마 목소리로 노래와 표현을 들려주고 싶은 분</li><li>혼자 외우고 반복하기가 어려운 분</li><li>아이의 즉각적인 아웃풋보다 꾸준한 노출을 원하는 분</li></ul>\n<div style=\"margin-top: 52px; padding-top: 32px; border-top: 1px solid #D3DFDA; text-align: center\"><p style=\"margin: 0 0 24px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(31px, 6.8vw, 39px); font-weight: 400; line-height: 1.55; color: #333533\">완벽하게 부르기보다,<br/>오늘 한 번 더 불러주는 것부터.</p><div style=\"display: flex; justify-content: center\"><button class=\"kk-g\" onclick=\"{{ go.umseStudies }}\" style=\"font-family: inherit; font-size: 16px; font-weight: 600; padding: 12px 26px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap\" type=\"button\">엄세스 스터디 둘러보기 <span aria-hidden=\"true\">→</span></button></div></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isStudies }}\">\n<main class=\"kk-txt\" style=\"max-width: 1040px; margin: 0 auto; padding: 32px 20px 72px\">\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ canBack }}\"><div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div></sc-if>\n<p style=\"margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #518474\"><span aria-hidden=\"true\" style=\"display: inline-block; width: 18px; height: 1px; background: #518474\"></span>스터디 둘러보기</p><h1 style=\"margin: 0 0 16px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(30px, 5vw, 44px); font-weight: 500; line-height: 1.3; letter-spacing: -0.03em; color: #333533\">혼자서는 미뤘던 책육아,<br/>함께라면 오늘부터.</h1>\n<p style=\"margin: 0 0 24px; font-size: 16px; line-height: 1.7; color: #2E3430\">우리 집 책과 교구에 맞는 스터디를 개월수 로드맵으로 살펴보세요.</p>\n<section style=\"margin: 0 0 22px; padding: 22px 20px; background: #EEF4F1\"><p style=\"margin: 0 0 12px\"><span style=\"display: inline-block; background: #518474; color: #FFFFFF; font-size: 15px; font-weight: 600; padding: 7px 12px\">강둥맘네 스터디 로드맵</span></p><p style=\"margin: 0 0 12px; font-size: 16.5px; line-height: 1.7; color: #333533\">강둥맘네 스터디는 <b style=\"color: #518474\">입문 · 엄세스 · 방출 · 멤버 전용 스터디</b>로 구성됩니다.</p><ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 6px\"><li style=\"display: flex; gap: 10px; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; margin-top: 10px\"></span><span>입문 스터디는 누구나 부담 없이 책육아를 시작해 볼 수 있는 <b>무료 과정</b>입니다</span></li><li style=\"display: flex; gap: 10px; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; margin-top: 10px\"></span><span>엄세스와 방출 스터디는 탄탄한 루틴을 만들고<br/>아이와 엄마의 실질적인 변화를 이끌어내는 <b>핵심 유료 과정</b>입니다</span></li><li style=\"display: flex; gap: 10px; font-size: 15.5px; line-height: 1.7; color: #333533\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 6px; height: 6px; background: #518474; margin-top: 10px\"></span><span>엄세스와 방출 스터디를 완주하시면 <b>‘강둥맘네 멤버’</b>로 전환되며,<br/>이후 진행되는 멤버 전용 스터디를 포함한 다양한 프로그램을 <b>추가 비용 없이</b> 자유롭게 참여하실 수 있습니다</span></li></ul><details style=\"margin-top: 16px; background: #FFFFFF; border: 1px solid #D3DFDA; padding: 12px 14px\"><summary style=\"cursor: pointer; font-size: 15px; font-weight: 600; color: #333533\">📢 강둥맘네 스터디 관련 공지</summary><p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.75; color: #333533\">안녕하세요, 강둥맘입니다.<br/>저는 전집을 그냥 책장에 두기보다,<br/>스터디를 만들어 ‘제대로 뽕 뽑는 것’을 정말 좋아해요.<br/>혼자 할 때보다 다 같이 목표를 향해 달려가는 과정이 훨씬 재미있거든요.<br/>그렇게 하나둘 만들다 보니 벌써 여기까지 오게 되었네요.</p><p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.75; color: #333533\">특히 이번 마더구스 스터디를 하며<br/>90곡을 거의 다 외웠던 경험은 저에게 정말 큰 성취였어요.<br/>남편도 인정해 줄 만큼 뿌듯했고,<br/>무엇보다 강둥이가 예전에 배운 보너스 곡을 허밍으로 따라 부르는 걸 보며<br/>‘아, 우리 아이들에게 이 노출이 헛되지 않았구나’ 확신이 들었습니다.</p><p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.75; color: #333533\">사실 저는 여러분이 올려주시는 인증샷 하나하나 보는 게 제 삶의 큰 즐거움이에요.<br/>그런데 스터디가 점점 늘어나다 보니 제 에너지가 분산되면서,<br/>소중한 기록들을 충분히 살피고 소통하지 못하는 상황이 생기더라고요.<br/>그게 개인적으로 너무 아쉽고 속상했습니다.</p><p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.75; color: #333533\">그래서 앞으로는 ‘선택과 집중’을 통해 콘텐츠의 퀄리티를 높이고,<br/>더 체계적으로 운영해 보려고 합니다.<br/><b style=\"color: #518474\">이를 위해 일부 스터디를 유료로 전환하기로 결정했습니다.</b></p><p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.75; color: #333533\">더 탄탄한 자료와 깊이 있는 소통으로 여러분의 소중한 전집이 집안의 보물이 될 수 있도록<br/>책임지고 이끌어 드릴게요.<br/>늘 믿고 함께해 주셔서 감사합니다!</p></details></section><div aria-label=\"카테고리\" role=\"group\" style=\"display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px\">\n<sc-for as=\"f\" hint-placeholder-count=\"6\" list=\"{{ catChips }}\">\n<button onclick=\"{{ f.pick }}\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 15px; padding: 9px 16px; min-height: 44px; border-radius: 0; cursor: pointer; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font-weight: 600\" type=\"button\">{{ f.label }}</button>\n</sc-for>\n</div>\n<sc-for as=\"g\" hint-placeholder-count=\"4\" list=\"{{ rmGroups }}\"><section style=\"margin: 0 0 22px; padding: 20px 18px 14px; border: 1px solid #D3DFDA\"><div style=\"display: flex; align-items: center; gap: 10px; margin: 0 0 10px\"><h2 style=\"margin: 0; font-size: 21px; font-weight: 500; letter-spacing: -0.03em; color: #333533\">{{ g.title }}</h2><span style=\"font-size: 12.5px; font-weight: 600; color: #FFFFFF; background: #518474; padding: 3px 8px\">{{ g.fee }}</span></div><sc-for as=\"d\" hint-placeholder-count=\"2\" list=\"{{ g.desc }}\"><p style=\"margin: 0 0 8px; font-size: 15px; line-height: 1.7; color: #2E3430\">{{ d.t }}</p></sc-for><div style=\"display: grid; grid-template-columns: {{rmCols}}; column-gap: 14px; margin-top: 14px; padding-bottom: 6px; border-bottom: 2px solid #518474\"><span style=\"display: {{rmLabelDisp}}; font-size: 13px; font-weight: 700; color: #518474\">로드맵</span><div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); font-size: 12.5px; font-weight: 600; color: #333533; text-align: center\"><span>~12m</span><span>18m</span><span>24m</span><span>30m</span><span>36m</span><span>40m</span></div></div><sc-for as=\"r\" hint-placeholder-count=\"5\" list=\"{{ g.rows }}\"><button onclick=\"{{ r.detail }}\" style=\"width: 100%; display: grid; grid-template-columns: {{rmCols}}; column-gap: 14px; row-gap: 6px; align-items: center; padding: 10px 0; border: none; border-bottom: 1px solid #D3DFDA; background: none; text-align: left; cursor: pointer; font-family: inherit\" type=\"button\"><span style=\"font-size: 14.5px; font-weight: 600; line-height: 1.4; color: #333533\">{{ r.name }} <span style=\"font-weight: 400; color: #6B706D\">{{ r.pd }}</span></span><span style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))\"><span style=\"grid-column: {{r.col}}; height: 16px; background: {{r.color}}; font-size: 12px; line-height: 16px; color: #8A8F8C\">{{ r.note }}</span></span></button></sc-for></section></sc-for><h2 style=\"margin: 34px 0 10px; font-size: 22px; font-weight: 500; letter-spacing: -0.03em; color: #333533\">스터디 목록</h2><div style=\"border-top: 1px solid #D3DFDA\">\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ noResult }}\"><p style=\"margin: 0; padding: 40px 0; text-align: center; font-size: 16px; color: #6B706D; border-bottom: 1px solid #D3DFDA\">이 카테고리의 스터디가 아직 없어요</p></sc-if>\n<sc-for as=\"c\" hint-placeholder-count=\"8\" list=\"{{ cards }}\">\n<button aria-label=\"{{ c.aria }}\" onclick=\"{{ c.detail }}\" style=\"width: 100%; display: flex; flex-wrap: nowrap; align-items: center; gap: 16px; padding: 22px 4px; border: none; border-bottom: 1px solid #D3DFDA; background: none; text-align: left; cursor: pointer; font-family: inherit; color: #333533\" type=\"button\">\n<span style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px\">\n<span style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 14px; color: #6B706D\">{{ c.cat }} · {{ c.meta }}</span>\n<span style=\"font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.35; color: #333533\">{{ c.name }}</span>\n<span style=\"font-size: 15px; line-height: 1.65; color: #2E3430\">{{ c.intro }}</span>\n</span>\n</span>\n<span aria-hidden=\"true\" style=\"flex: 0 0 auto; align-self: center; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 5px; color: #518474\">보기</span>\n</button>\n</sc-for>\n</div>\n<p style=\"margin: 20px 0 0; font-size: 15px; line-height: 1.6; color: #2E3430\"><b style=\"color: #333533\">신청 방법</b>  스터디 모집 게시글에 댓글 달기 → DM으로 신청서 발송 → 신청서 작성 및 제출</p><p style=\"margin: 14px 0 0; padding: 16px 18px; background: #EEF4F1; font-size: 16px; line-height: 1.65; color: #333533\"><b>엄세스·방출 스터디를 완주하면 ‘강둥맘네 멤버’가 돼요.</b><br/><span style=\"color: #2E3430\">멤버 전용 스터디를 포함한 다양한 프로그램을 추가 비용 없이 참여할 수 있어요. 스터디마다 8주 이상 인증하면 강둥맘네 소통방에 초대해 드려요.</span></p><h2 style=\"margin: 52px 0 10px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 24px; font-weight: 500; color: #333533\">자주 묻는 질문</h2>\n<div style=\"border-top: 1px solid #D3DFDA\"><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">기존 멤버는 어떻게 로그인하나요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">‘처음이에요 · 가입 신청하기’에서 이메일과 함께 다시 가입하고<br/>예전 닉네임을 적어 주세요.<br/>강둥맘이 예전 계정과 연결해 드리고, 인증 기록은 그대로 남아요.</p></details><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">사진 인증은 어디에 올리나요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">사진 인증은 지금처럼 네이버 밴드에서 해요.<br/>홈페이지에서는 자료 확인과 인증 체크를 해요.</p></details><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">참가비는 얼마인가요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">입문 스터디는 무료예요.<br/>엄세스·방출 스터디는 스터디마다 10,000원~20,000원이고, 각 스터디 상세에서 확인할 수 있어요.<br/>강둥맘네 멤버는 멤버 전용 스터디를 추가 비용 없이 참여해요.</p></details><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">사정이 있어 한 주 쉬어도 되나요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">스터디마다 휴가권(1~2회)이 있어서,<br/>개인 사유로 인증이 어려운 주에는 휴가로 표시할 수 있어요.<br/>휴가권 이후 미인증 시에는 스터디에서 제외될 수 있어요.</p></details></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isStudy }}\">\n<main class=\"kk-txt\" style=\"max-width: 760px; margin: 0 auto; padding: 32px 20px 72px\">\n<div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div><p style=\"margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 14px // ── 비밀번호: SHA-256 해시로 저장 (원문 저장 안 함) ──
function kkSha256Hex(str){
  var b=unescape(encodeURIComponent(str)),n=b.length,i,j;
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var words=[],len=((n+9+63)>>6)<<4;
  for(i=0;i<len;i++)words[i]=0;
  for(i=0;i<n;i++)words[i>>2]|=(b.charCodeAt(i)&255)<<(24-(i%4)*8);
  words[n>>2]|=0x80<<(24-(n%4)*8);
  words[len-1]=n*8;
  var w=new Array(64),a,c,d,e,f,g,h,bb,t1,t2;
  var r=function(x,k){return (x>>>k)|(x<<(32-k));};
  for(i=0;i<len;i+=16){
    a=H[0];bb=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
    for(j=0;j<64;j++){
      if(j<16)w[j]=words[i+j]|0;
      else{var s0=r(w[j-15],7)^r(w[j-15],18)^(w[j-15]>>>3),s1=r(w[j-2],17)^r(w[j-2],19)^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)|0;}
      t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[j]+w[j])|0;
      t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8);}).join('');
}
async function hashPw(mid,pw){
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder))return kkSha256Hex('kkang|'+mid+'|'+pw);

  var h=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

function rtnCardStats(sid,mid){
  var stats={};
  var prefix=sid+'__rcards__',suffix='__'+mid;
  Object.keys(S.checkins).forEach(function(k){
    if(k.indexOf(prefix)!==0)return;
    if(k.slice(-suffix.length)!==suffix)return;
    var dk=k.slice(prefix.length,k.length-suffix.length);
    var ids=S.checkins[k]?S.checkins[k].split(','):[];
    ids.forEach(function(cid){
      if(!stats[cid])stats[cid]={count:0,dates:[]};
      stats[cid].count++;stats[cid].dates.push(dk);

  });
  Object.keys(stats).forEach(function(cid){stats[cid].dates.sort();});

}

function getSkipDays(startDate,now){
  // 등록된 휴강 기간 중 startDate~now 사이에 겹치는 일수를 모두 더해서 반환
  if(!S.skipWeeks||!S.skipWeeks.length)return 0;
  var total=0;
  S.skipWeeks.forEach(function(sw){
    if(!sw.startDate||!sw.endDate)return;
    var swStart=new Date(sw.startDate);swStart.setHours(0,0,0,0);
    var swEnd=new Date(sw.endDate);swEnd.setHours(0,0,0,0);swEnd.setDate(swEnd.getDate()+1);//종료일 포함(배타적 끝)
    var ovStart=swStart>startDate?swStart:startDate;
    var ovEnd=swEnd<now?swEnd:now;
    if(ovEnd>ovStart)total+=Math.round((ovEnd-ovStart)/(24*60*60*1000));
  });
  return total;
}
function getCurrentWeek(s){
  if(!s.startDate)return 0;
  var start=new Date(s.startDate);start.setHours(0,0,0,0);
  var now=new Date();now.setHours(0,0,0,0);
  var diff=now-start;
  if(diff<0)return 0;
  diff-=getSkipDays(start,now)*24*60*60*1000;
  if(diff<0)diff=0;
  return Math.floor(diff/(7*24*60*60*1000))+1;
}

// 루틴 월별 뱃지: 해당 월 경과일 대비 50% 이상 인증 시 💎
function getRoutineMonthBadge(sid,mid,yr,mo){
  var lastDate=new Date(yr,mo+1,0).getDate();
  var today=new Date();var done=0,total=0;
  for(var d=1;d<=lastDate;d++){
    var dt=new Date(yr,mo,d);if(dt>today)break;
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    total++;if(rtnCk(sid,dk,mid)==='done')done++;
  }
  return total>0&&done/total>=0.5;
}

  });

}

    if(S.checkins[nk]===undefined){S.checkins[nk]=S.checkins[k];patch[nk]=S.checkins[k];}
    delete S.checkins[k];patch[k]=null;});
  S.members=S.members.filter(function(x){return x.id!==n.id;});
  S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return 0;}});
  if(S.loggedMember&&S.loggedMember.id===n.id){S.loggedMember=t;try{localStorage.setItem('kkang_member_id',t.id);}catch(e){}}
  await persist();
  if(Object.keys(patch).length){try{await fbPatchCheckins(patch);}catch(e){alert('인증 기록 옮기기 저장 실패. 인터넷 연결을 확인해 주세요.');}}
  showToast('🔗 '+t.name+'님 예전 기록 연동 완료','success');render();
}
