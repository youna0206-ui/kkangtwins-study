<style>:root{--pr:#E91E8C;--prl:#FDE8F4;--bl:#3B82F6;--bll:#EFF6FF;--bld:#2563EB;--gr:#22C55E;--grb:#F0FDF4;--or:#F59E0B;--orb:#FFFBEB;--rd:#EF4444;--bg:#FDF5FB;--bgd:#FAE8F5;--wh:#fff;--tx:#2D2D2D;--mu:#9CA3AF;--br:#F3D0E9;--r:14px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;min-height:100vh;padding-bottom:2.5rem}
.wrap{max-width:520px;margin:0 auto;padding:.75rem}
.hd{background:linear-gradient(135deg,#E91E8C,#7B2FF7 60%,#3B82F6);border-radius:22px;padding:1.25rem 1.5rem;margin-bottom:1rem;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 6px 24px rgba(233,30,140,.25)}
.hd-left .hd-tag{font-size:11px;opacity:.85;letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.hd-left .hd-title{font-size:20px;font-weight:700}
.hd-sub{margin-top:6px;font-size:12px;opacity:.8}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;margin-top:2px}
.hd-user{background:rgba(255,255,255,.25);border-radius:16px;padding:3px 10px;font-size:12px;font-weight:600}
.hd-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem;padding-bottom:2px}
.tab{flex:0 0 auto;padding:.45rem .75rem;border-radius:20px;border:1.5px solid var(--br);background:var(--wh);color:var(--mu);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--pr),#7B2FF7);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 2px 10px rgba(233,30,140,.3)}
.tab.at{border-color:#CDDFFE;color:var(--bl)}

one; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div>\n<div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 20px; border-top: 1px solid #D3DFDA; padding-top: 18px\"><div><p style=\"margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: #333533\">강둥맘 이야기</p><h1 style=\"margin: 0; font-size: {{h2Size}}; font-weight: 500; line-height: 1.12; letter-spacing: -0.03em; color: #333533; margin-top: 22px\">안녕하세요,<br/>강둥맘이에요</h1><p style=\"margin: 22px 0 0; font-size: 18px; font-weight: 600; line-height: 1.55; color: #518474\">책과 교구를 사는 데 진심,<br/>뽕뽑는 데는 더 진심.</p></div><div><p style=\"margin: 0 0 14px; font-size: 13px; font-weight: 600; color: #518474\">시작 계기</p><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">23년 4월생 쌍둥이를 키우는 약대생이에요.</p><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">책과 교구를 좋아해서 하나둘 들이다 보니, 사놓은 책과 교구를 제대로 뽕뽑고 싶어 스터디를 시작했어요.</p><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">엄가다도 직접 해보면서 부담 없이 활용할 수 있는 방법을 찾아왔어요. (자세한 이야기는 준비하고 있어요.)</p><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">약대 입시와 면접도 스터디로 준비했어요. (자세한 이야기는 준비하고 있어요.)</p></div><div><p style=\"margin: 0 0 14px; font-size: 13px; font-weight: 600; color: #518474\">운영 방향</p><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">억지로 끝내기보다 아이의 관심에 맞춰, 짧더라도 꾸준히 함께하는 책육아를 지향해요.</p><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">혼자가 아니라 함께 실천하고 함께 성장하는 스터디를 만들고 있어요.</p><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">엄마가 세이펜이 되어 영어를 일상으로 이어가는 녹음 스터디, 엄세스도 운영하고 있어요.</p><button onclick=\"{{ go.umse }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 0; min-height: 44px; border: none; background: none; color: #518474; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px\" type=\"button\">엄세스 자세히 보기</button></div></div>\n<div style=\"margin-top: 40px\"></div>\n<div style=\"display: grid; grid-template-columns: {{cols3}}; column-gap: {{colGap}}; row-gap: 20px; margin-top: 56px; border-top: 1px solid #D3DFDA; padding-top: 24px\"><div><img alt=\"\" aria-hidden=\"true\" src=\"__IMG_clv__\" style=\"display: block; width: 84px; height: auto; aspect-ratio: 320 / 203\"/></div><div style=\"grid-column: {{span2}}\"><p style=\"margin: 0; font-size: {{h3Size}}; font-weight: 500; line-height: 1.3; letter-spacing: -0.025em; color: #333533\">행운 같은 아이들과 행복하게 육아하기<br/><span style=\"color: #518474\">강둥이네에서 함께해요</span></p><p style=\"margin: 14px 0 0; font-size: 13px; color: #6B706D\">세잎클로버는 아이와 함께하는 일상의 행복, 네잎클로버는 우리에게 찾아온 행운 같은 아이들이에요.</p></div></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isTips }}\">\n<main style=\"max-width: 760px; margin: 0 auto; padding: 32px 20px 72px\">\n<div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div><p style=\"margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #518474\"><span aria-hidden=\"true\" style=\"display: inline-block; width: 18px; height: 1px; background: #518474\"></span>책육아 꿀팁</p><h1 style=\"margin: 0 0 16px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(30px, 5vw, 44px); font-weight: 500; line-height: 1.3; letter-spacing: -0.03em; color: #333533\">끝까지 읽는 것보다,<br/>한 번 더 즐겁게.</h1>\n<p style=\"margin: 0 0 28px; font-size: 17px; line-height: 1.7; color: #2E3430\">강둥이들과 직접 해온 책육아 뽕뽑는 꿀팁 4가지.</p>\n\n<article style=\"padding: 30px 0 30px; border-top: 1px solid #D3DFDA\">\n<span aria-hidden=\"true\" style=\"display: block; width: 22px; height: 1px; background: #518474; margin-bottom: 12px\"></span>\n<p style=\"margin: 0 0 6px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 34px; line-height: 1; color: {{accent}}\">01</p>\n<h2 style=\"margin: 0 0 14px; font-size: 21px; font-weight: 500; line-height: 1.45; color: #333533\">엄마가 세이펜 되기</h2>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">책 속 영어 노래와 표현을 엄마 목소리로 일상에서도 들려줘요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">아이들에게 더 자주 들려주고 싶어 전집 노래와 마더구스를 외워 부르기 시작했어요.</p>\n<div style=\"margin: 4px 0 0; padding: 14px 16px; border-left: 2px solid #518474; background: rgba(255,255,255,0.4); border-radius: 0\"><p style=\"margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #333533\">강둥이네 예시</p><p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #333533\">버스를 보며 “The Wheels on the Bus”를 부르고, 다리를 건너며 “London Bridge”를 불러요.</p></div>\n</article>\n<article style=\"padding: 30px 0 30px; border-top: 1px solid #D3DFDA\">\n<span aria-hidden=\"true\" style=\"display: block; width: 22px; height: 1px; background: #518474; margin-bottom: 12px\"></span>\n<p style=\"margin: 0 0 6px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 34px; line-height: 1; color: {{accent}}\">02</p>\n<h2 style=\"margin: 0 0 14px; font-size: 21px; font-weight: 500; line-height: 1.45; color: #333533\">아이가 놀아도 엄마 혼자 책 읽기</h2>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">아이를 억지로 앉히기보다 엄마가 먼저 재미있게 읽어요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">아이가 다른 곳에 있더라도 엄마 혼자 소리 내서 읽어요.</p>\n<div style=\"margin: 4px 0 0; padding: 14px 16px; border-left: 2px solid #518474; background: rgba(255,255,255,0.4); border-radius: 0\"><p style=\"margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #333533\">강둥이네 예시</p><p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #333533\">내용을 준비하고 있어요</p></div>\n</article>\n<article style=\"padding: 30px 0 30px; border-top: 1px solid #D3DFDA\">\n<span aria-hidden=\"true\" style=\"display: block; width: 22px; height: 1px; background: #518474; margin-bottom: 12px\"></span>\n<p style=\"margin: 0 0 6px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 34px; line-height: 1; color: {{accent}}\">03</p>\n<h2 style=\"margin: 0 0 14px; font-size: 21px; font-weight: 500; line-height: 1.45; color: #333533\">끝까지 읽기보다 재미있게 읽기</h2>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">계획한 활동을 모두 끝내기보다 아이의 관심을 따라가 보세요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">한 페이지를 읽고 이야기를 나누거나 짧게 놀아도 좋아요.</p>\n<div style=\"margin: 4px 0 0; padding: 14px 16px; border-left: 2px solid #518474; background: rgba(255,255,255,0.4); border-radius: 0\"><p style=\"margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #333533\">강둥이네 예시</p><p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #333533\">내용을 준비하고 있어요</p></div>\n</article>\n<article style=\"padding: 30px 0 30px; border-top: 1px solid #D3DFDA\">\n<span aria-hidden=\"true\" style=\"display: block; width: 22px; height: 1px; background: #518474; margin-bottom: 12px\"></span>\n<p style=\"margin: 0 0 6px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 34px; line-height: 1; color: {{accent}}\">04</p>\n<h2 style=\"margin: 0 0 14px; font-size: 21px; font-weight: 500; line-height: 1.45; color: #333533\">잠자리 독서를 루틴으로 만들기</h2>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">강둥이들은 10개월부터 잠자리 독서를 시작했어요.</p>\n<ol style=\"margin: 4px 0 16px; padding: 0; list-style: none; display: grid; gap: 10px\"><li style=\"padding: 14px 16px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none\"><b style=\"display: block; font-size: 14px; color: #333533\">10개월부터</b><span style=\"font-size: 15px; line-height: 1.7; color: #333533\">내용을 준비하고 있어요</span></li><li style=\"padding: 14px 16px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none\"><b style=\"display: block; font-size: 14px; color: #333533\">18개월 전후부터 달라진 순서</b><span style=\"font-size: 15px; line-height: 1.7; color: #333533\">내용을 준비하고 있어요</span></li></ol>\n</article>\n<div style=\"margin-top: 20px; display: flex; justify-content: center\"><button class=\"kk-g\" onclick=\"{{ go.studies }}\" style=\"font-family: inherit; font-size: 16px; font-weight: 600; padding: 12px 26px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap\" type=\"button\">스터디 둘러보기 <span aria-hidden=\"true\">→</span></button></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isUmse }}\">\n<main style=\"max-width: 760px; margin: 0 auto; padding: 32px 20px 72px\">\n<div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div><p style=\"margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #518474\"><span aria-hidden=\"true\" style=\"display: inline-block; width: 18px; height: 1px; background: #518474\"></span>엄세스</p><h1 style=\"margin: 0 0 16px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(30px, 5vw, 44px); font-weight: 500; line-height: 1.3; letter-spacing: -0.03em; color: #333533\">책을 덮어도,<br/>엄마의 노래는 계속돼요.</h1>\n<p style=\"margin: 0 0 8px; font-size: 17px; line-height: 1.7; color: #2E3430\">엄마가 세이펜이 되어 영어를 일상으로 이어가는 녹음 스터디.</p>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">엄세스란?</h2>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">엄세스는 ‘엄마가 세이펜’이 되어 책 속 영어 노래와 표현을 일상에서도 들려주는 스터디예요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">책을 펼칠 때뿐 아니라 산책하고, 차를 타고, 함께 놀 때도 익숙한 노래 한 소절로 책과 일상을 연결해요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">제가 아이들에게 더 자주 들려주고 싶어 전집 노래와 마더구스를 외워 부르면서 시작했고, 그 과정이 녹음 인증 스터디로 이어졌어요.</p>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">어떻게 참여하나요?</h2>\n<ol style=\"margin: 0 0 18px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 10px\"><li style=\"flex: 1 1 120px; min-width: 0; padding: 16px 14px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none; text-align: center\"><span style=\"display: block; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 22px; color: #518474\">1</span><span style=\"display: block; margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.5; color: #333533\">음원 듣기</span></li><li style=\"flex: 1 1 120px; min-width: 0; padding: 16px 14px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none; text-align: center\"><span style=\"display: block; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 22px; color: #518474\">2</span><span style=\"display: block; margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.5; color: #333533\">따라 부르기</span></li><li style=\"flex: 1 1 120px; min-width: 0; padding: 16px 14px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none; text-align: center\"><span style=\"display: block; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 22px; color: #518474\">3</span><span style=\"display: block; margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.5; color: #333533\">내 목소리로 녹음하기</span></li><li style=\"flex: 1 1 120px; min-width: 0; padding: 16px 14px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none; text-align: center\"><span style=\"display: block; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 22px; color: #518474\">4</span><span style=\"display: block; margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.5; color: #333533\">인증하기</span></li><li style=\"flex: 1 1 120px; min-width: 0; padding: 16px 14px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none; text-align: center\"><span style=\"display: block; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 22px; color: #518474\">5</span><span style=\"display: block; margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.5; color: #333533\">일상에서 아이에게 들려주기</span></li></ol>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">처음부터 완벽하게 외우거나 노래를 잘 부를 필요는 없어요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">들으며 따라 부르고, 익숙해진 표현을 일상에서 하나씩 꺼내보세요.</p>\n<p style=\"margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #6B706D\">인증 일정과 분량, 제출 방식은 각 스터디의 실제 안내를 따라요.</p>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">어떤 종류가 있나요?</h2>\n<div style=\"border-top: 1px solid #D3DFDA\">\n<sc-for as=\"u\" hint-placeholder-count=\"6\" list=\"{{ umseTypes }}\">\n<div style=\"padding: 18px 2px; border-bottom: 1px solid #D3DFDA; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px\"><div style=\"flex: 1 1 260px; min-width: 0\"><p style=\"margin: 0 0 4px; font-size: 19px; font-weight: 600; color: #333533\">{{ u.name }}</p><p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #2E3430\">{{ u.info }}</p></div><sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ u.hasSample }}\"><button class=\"kk-g\" onclick=\"{{ u.sample }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 20px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap\" type=\"button\">자료 예시 보기</button></sc-if></div>\n</sc-for>\n</div>\n<h3 style=\"margin: 28px 0 8px; font-size: 17px; font-weight: 500; color: #333533\">현재 모집 중인 엄세스</h3>\n<sc-if hint-placeholder-val=\"{{ true }}\" value=\"{{ umseOpenNone }}\"><p style=\"margin: 0; font-size: 15px; line-height: 1.7; color: #6B706D\">모집이 확인된 스터디가 생기면 이곳에 신청 버튼과 함께 안내해요.</p></sc-if>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">엄세스를 통해 기대하는 변화</h2>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">①</span>엄마가 먼저 익숙해져요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">녹음을 준비하며 듣고 따라 부르는 과정에서 노래와 표현을 반복하게 돼요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">음원을 켜야만 활용할 수 있던 상태에서 익숙한 한 소절을 직접 꺼내 부르는 방향으로 조금씩 나아가는 것이 목표예요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">②</span>책 밖에서도 활용할 기회가 생겨요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">버스를 보며 “The Wheels on the Bus”를 부르고, 다리를 건너며 “London Bridge”를 부르는 것처럼 책에서 만난 표현을 실제 장면과 연결해볼 수 있어요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">③</span>사놓은 음원과 책을 다시 활용하게 돼요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">매번 새로운 자료를 찾기보다 이미 가진 책과 음원을 반복해서 사용하는 계기를 만들어줘요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">④</span>혼자 미루던 활용을 함께 이어가요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">녹음과 인증이라는 작은 목표가 오늘도 한 번 듣고 불러보는 동기가 될 수 있어요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">강둥맘에게도 녹음 인증은 반복해서 활용하는 데 도움이 된 방법이었어요.</p>\n</article>\n<article style=\"padding: 22px 0; border-top: 1px solid #D3DFDA\"><h3 style=\"margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #333533\"><span style=\"font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; color: {{accent}}; margin-right: 8px\">⑤</span>아이에게 익숙한 노래와 표현을 쌓아가요</h3><p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">일상에서 같은 노래와 표현을 다시 만나는 기회를 만들어줘요.</p>\n<p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: #333533\">아이의 반응과 발화 시기는 다를 수 있으니 바로 따라 말하는지보다 즐겁게 함께하는 과정을 중요하게 생각해요.</p>\n</article>\n<h2 style=\"margin: 44px 0 14px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(22px, 3.4vw, 27px); font-weight: 500; letter-spacing: -0.03em; color: #333533\">이런 분께 어울려요</h2>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.9; color: #333533\"><li>영어 전집과 음원을 샀지만 활용이 뜸한 분</li><li>엄마 목소리로 노래와 표현을 들려주고 싶은 분</li><li>혼자 외우고 반복하기가 어려운 분</li><li>아이의 즉각적인 아웃풋보다 꾸준한 노출을 원하는 분</li></ul>\n<div style=\"margin-top: 52px; padding-top: 32px; border-top: 1px solid #D3DFDA; text-align: center\"><p style=\"margin: 0 0 24px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(31px, 6.8vw, 39px); font-weight: 400; line-height: 1.55; color: #333533\">완벽하게 부르기보다,<br/>오늘 한 번 더 불러주는 것부터.</p><div style=\"display: flex; justify-content: center\"><button class=\"kk-g\" onclick=\"{{ go.umseStudies }}\" style=\"font-family: inherit; font-size: 16px; font-weight: 600; padding: 12px 26px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap\" type=\"button\">엄세스 스터디 둘러보기 <span aria-hidden=\"true\">→</span></button></div></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isStudies }}\">\n<main style=\"max-width: 1040px; margin: 0 auto; padding: 32px 20px 72px\">\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ canBack }}\"><div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button></div></sc-if>\n<p style=\"margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #518474\"><span aria-hidden=\"true\" style=\"display: inline-block; width: 18px; height: 1px; background: #518474\"></span>스터디 둘러보기</p><h1 style=\"margin: 0 0 16px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: clamp(30px, 5vw, 44px); font-weight: 500; line-height: 1.3; letter-spacing: -0.03em; color: #333533\">혼자서는 미뤘던 책육아,<br/>함께라면 오늘부터.</h1>\n<p style=\"margin: 0 0 24px; font-size: 16px; line-height: 1.7; color: #2E3430\">우리 집 책과 교구에 맞는 스터디, 자료 예시부터 살펴보세요.</p>\n<div aria-label=\"카테고리\" role=\"group\" style=\"display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px\">\n<sc-for as=\"f\" hint-placeholder-count=\"6\" list=\"{{ catChips }}\">\n<button onclick=\"{{ f.pick }}\" style=\"flex: 0 0 auto; font-family: inherit; font-size: 15px; padding: 9px 16px; min-height: 44px; border-radius: 0; cursor: pointer; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font-weight: 600\" type=\"button\">{{ f.label }}</button>\n</sc-for>\n</div>\n<div style=\"border-top: 1px solid #D3DFDA\">\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ noResult }}\"><p style=\"margin: 0; padding: 40px 0; text-align: center; font-size: 16px; color: #6B706D; border-bottom: 1px solid #D3DFDA\">이 카테고리의 스터디가 아직 없어요</p></sc-if>\n<sc-for as=\"c\" hint-placeholder-count=\"8\" list=\"{{ cards }}\">\n<button aria-label=\"{{ c.aria }}\" onclick=\"{{ c.detail }}\" style=\"width: 100%; display: flex; flex-wrap: nowrap; align-items: center; gap: 16px; padding: 22px 4px; border: none; border-bottom: 1px solid #D3DFDA; background: none; text-align: left; cursor: pointer; font-family: inherit; color: #333533\" type=\"button\">\n<span style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px\">\n<span style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 14px; color: #6B706D\">{{ c.cat }}</span>\n<span style=\"font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.35; color: #333533\">{{ c.name }}</span>\n<span style=\"font-size: 15px; line-height: 1.65; color: #2E3430\">{{ c.intro }}</span>\n</span>\n</span>\n<span aria-hidden=\"true\" style=\"flex: 0 0 auto; align-self: center; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 5px; color: #518474\">보기</span>\n</button>\n</sc-for>\n</div>\n<p style=\"margin: 20px 0 0; font-size: 15px; line-height: 1.6; color: #2E3430\"><b style=\"color: #333533\">참여 방법</b>  스터디 선택 → 주차별 자료 확인과 활동 → 활동 인증</p>\n<p style=\"margin: 14px 0 0; padding: 16px 18px; border-radius: 0; background: #FFFFFF; border: 1px solid #FFFFFF; box-shadow: none; font-size: 16px; line-height: 1.65; color: #333533\"><b>스터디 8주 이상 인증하면 소통방에 초대해드려요.</b><br/><span style=\"color: #2E3430\">소통방 멤버가 되면 강둥맘네 모든 스터디를 무료로 참여하실 수 있어요.</span></p>\n<h2 style=\"margin: 52px 0 10px; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', sans-serif; font-size: 24px; font-weight: 500; color: #333533\">자주 묻는 질문</h2>\n<div style=\"border-top: 1px solid #D3DFDA\"><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">기존 멤버는 어떻게 로그인하나요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">처음 한 번은 기존 닉네임과 기존 비밀번호로 로그인해요. 로그인 후 새 아이디와 비밀번호를 설정하면 다음부터는 새 아이디로 들어와요.</p></details><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">사진 인증은 어디에 올리나요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">사진 인증은 지금처럼 네이버 밴드에서 해요. 홈페이지에서는 자료 확인과 인증 체크를 해요.</p></details><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">참가비는 얼마인가요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">내용을 준비하고 있어요</p></details><details style=\"border-bottom: 1px solid #DFE8E2; padding: 16px 4px\"><summary style=\"cursor: pointer; font-weight: 600; color: #333533\">사정이 있어 한 주 쉬어도 되나요?</summary><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: #333533\">인증 기간 안에 휴가로 표시할 수 있어요. 휴강 주에는 주차가 넘어가지 않아요.</p></details></div>\n</main>\n</sc-if>\n\n<sc-if hint-placeholder-val=\"{{ false }}\" value=\"{{ isStudy }}\">\n<main style=\"max-width: 760px; margin: 0 auto; padding: 32px 20px 72px\">\n<div style=\"margin: 0 0 18px\"><button class=\"kk-g\" onclick=\"{{ go.back }}\" style=\"font-family: inherit; font-size: 15px; font-weight: 600; padding: 8px 18px 8px 14px; min-height: 44px; box-sizing: border-box; border-radius: 0; border: 1px solid #D3DFDA; background: transparent; box-shadow: none; color: #333533; cursor: pointer; display: inline-flex; align-items: center; gap: 4px\" type=\"button\"><span aria-hidden=\"true\">‹</span> 뒤로</button async function hashPw(mid,pw){
  if(!(window.crypto&&crypto.subtle))throw new Error('no-crypto');
  var buf=new TextEncoder().encode('kkang|'+mid+'|'+pw);
  var h=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

function ck(sid,wn,mid){return S.checkins[ckKey(sid,wn,mid)]||null;}
function setCk(sid,wn,mid,val){var k=ckKey(sid,wn,mid);if(val)S.checkins[k]=val;else delete S.checkins[k];}
// 루틴 날짜형 체크인 (키: sid+'__date__'+dateKey+'__'+mid)
function rtnCkKey(sid,dk,mid){return sid+'__date__'+dk+'__'+mid;}
function rtnCk(sid,dk,mid){return S.checkins[rtnCkKey(sid,dk,mid)]||null;}
function setRtnCk(sid,dk,mid,val){var k=rtnCkKey(sid,dk,mid);if(val)S.checkins[k]=val;else delete S.checkins[k];}
// 루틴 메모 (키: sid+'__memo__'+dateKey+'__'+mid)
function rtnMemoKey(sid,dk,mid){return sid+'__memo__'+dk+'__'+mid;}
function rtnMemo(sid,dk,mid){return S.checkins[rtnMemoKey(sid,dk,mid)]||'';}
function setRtnMemo(sid,dk,mid,val){var k=rtnMemoKey(sid,dk,mid);if(val)S.checkins[k]=val;else delete S.checkins[k];}
// 스터디 카드 체크리스트 (주차 인증과 별개, 멤버 본인 것만 체크). 스터디 하나에 여러 개의 카드리스트(덱)를 둘 수 있음
function cardCkKey(sid,did,cid,mid){return sid+'__card__'+did+'__'+cid+'__'+mid;}
function cardCk(sid,did,cid,mid){return S.checkins[cardCkKey(sid,did,cid,mid)]||null;}
function setCardCk(sid,did,cid,mid,val){var k=cardCkKey(sid,did,cid,mid);if(val)S.checkins[k]=val;else delete S.checkins[k];}
// 루틴 체크 - 날짜별 카드 선택 (연결된 카드덱에서 그 날 한 카드들, 여러 장 가능). 키: sid+'__rcards__'+dk+'__'+mid, 값: 콤마구분 카드id
function rtnCardsKey(sid,dk,mid){return sid+'__rcards__'+dk+'__'+mid;}
function rtnCards(sid,dk,mid){var v=S.checkins[rtnCardsKey(sid,dk,mid)];return v?v.split(','):[];}
function setRtnCards(sid,dk,mid,arr){var k=rtnCardsKey(sid,dk,mid);if(arr&&arr.length)S.checkins[k]=arr.join(',');else delete S.checkins[k];}
function toggleRtnCard(sid,dk,mid,cid){var arr=rtnCards(sid,dk,mid);var i=arr.indexOf(cid);if(i>=0)arr.splice(i,1);else arr.push(cid);setRtnCards(sid,dk,mid,arr);return arr;}
// 루틴 체크 - 멤버별 카드 노출 통계 (지금까지 선택한 모든 날짜 기준). 반환: {cardId:{count, dates:[dateKey,...]}}
function rtnCardStats(sid,mid){
  var stats={};
  var prefix=sid+'__rcards__',suffix='__'+mid;
  Object.keys(S.checkins).forEach(function(k){
    if(k.indexOf(prefix)!==0)return;
    if(k.slice(-suffix.length)!==suffix)return;
    var dk=k.slice(prefix.length,k.length-suffix.length);
    var ids=S.checkins[k]?S.checkins[k].split(','):[];
    ids.forEach(function(cid){
      if(!stats[cid])stats[cid]={count:0,dates:[]};
      stats[cid].count++;stats[cid].dates.push(dk);
    });
  });
  Object.keys(stats).forEach(function(cid){stats[cid].dates.sort();});
  return stats;
}
// 루틴 체크 스터디에 연결된 카드덱 (관리자가 지정, s.routineDeckId="소유스터디id__덱id". 다른 스터디에 만든 덱도 연결 가능)
function routineDeck(s){
  if(!s||!s.routineDeckId)return null;
  var rid=s.routineDeckId,sep=rid.indexOf('__');
  var ownerSid=sep>=0?rid.slice(0,sep):s.id;
  var did=sep>=0?rid.slice(sep+2):rid;
  var owner=S.studies.filter(function(x){return x.id===ownerSid;})[0];
  if(!owner||!owner.cardDecks)return null;
  return owner.cardDecks.filter(function(x){return x.id===did;})[0]||null;
}

  // 스터디 이름

  // 인스타 태그

  var closeBtn=document.getElementById('complete-close');

function getSkipDays(startDate,now){
  // 등록된 휴강 기간 중 startDate~now 사이에 겹치는 일수를 모두 더해서 반환
  if(!S.skipWeeks||!S.skipWeeks.length)return 0;
  var total=0;
  S.skipWeeks.forEach(function(sw){
    if(!sw.startDate||!sw.endDate)return;
    var swStart=new Date(sw.startDate);swStart.setHours(0,0,0,0);
    var swEnd=new Date(sw.endDate);swEnd.setHours(0,0,0,0);swEnd.setDate(swEnd.getDate()+1);//종료일 포함(배타적 끝)
    var ovStart=swStart>startDate?swStart:startDate;
    var ovEnd=swEnd<now?swEnd:now;
    if(ovEnd>ovStart)total+=Math.round((ovEnd-ovStart)/(24*60*60*1000));
  });
  return total;
}
function getCurrentWeek(s){
  if(!s.startDate)return 0;
  var start=new Date(s.startDate);start.setHours(0,0,0,0);
  var now=new Date();now.setHours(0,0,0,0);
  var diff=now-start;
  if(diff<0)return 0;
  diff-=getSkipDays(start,now)*24*60*60*1000;
  if(diff<0)diff=0;
  return Math.floor(diff/(7*24*60*60*1000))+1;
}

function getStudyBadge(s,m){
  var aw=allWeeks(s);if(!aw.length)return null;
  var done=aw.filter(function(w){return ck(s.id,w.num,m.id)==='done';}).length;
  var total=aw.length;var allDone=done===total;
  if((total===4||total===5)&&allDone)return{badge:'💎',label:'다이아',color:'#22D3EE',bg:'#ECFEFF',border:'#22D3EE'};
  if(total>=8&&allDone)return{badge:'🥇',label:'금메달',color:'#D97706',bg:'#FEF3C7',border:'#D97706'};
  if(total>=8&&done>=8)return{badge:'🥈',label:'은메달',color:'#6B7280',bg:'#F3F4F6',border:'#9CA3AF'};
  return null;
}
// 루틴 월별 뱃지: 해당 월 경과일 대비 50% 이상 인증 시 💎
function getRoutineMonthBadge(sid,mid,yr,mo){
  var lastDate=new Date(yr,mo+1,0).getDate();
  var today=new Date();var done=0,total=0;
  for(var d=1;d<=lastDate;d++){
    var dt=new Date(yr,mo,d);if(dt>today)break;
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    total++;if(rtnCk(sid,dk,mid)==='done')done++;
  }
  return total>0&&done/total>=0.5;
}

  Object.keys(S.checkins).forEach(function(k){

    if(p[0]===sid&&p[1]==='date'&&p[3]===mid)yms[p[2].slice(0,7)]=true;
  });
  var cnt=0;
  Object.keys(yms).forEach(function(ym){
    var yr=+ym.slice(0,4),mo=+ym.slice(5,7)-1;
    if(getRoutineMonthBadge(sid,mid,yr,mo))cnt++;
  });
  return cnt;
}

// 이번주 미인증 스터디 수 (하단 뱃지)
function bnavTodoCount(){
  var m=curLoggedMember();if(!m)return 0;
  var n=0;
  S.studies.forEach(function(s){
    if(!s.active||s.cat==='루틴 체크'||(m.studyIds||[]).indexOf(s.id)<0)return;
    var cw=getCurrentWeek(s);if(cw<=0)return;
    var w=allWeeks(s).filter(function(x){return x.num===cw;})[0];
    if(w&&!w.locked&&!ck(s.id,w.num,m.id))n++;
  });
  return n>99?'99+':n;
}

// ── 루틴 체크 날짜형 렌더링 ──
function rRoutineStudy(s, m, showLeave){
  var offset=(S.routineWeekOffset&&S.routineWeekOffset[s.id])||0;
  var mon=getThisWeekMonday();
  mon.setDate(mon.getDate()+offset*7);
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);}
  var today=new Date();today.setHours(0,0,0,0);
  var todayKey=toDateKey(today);
  var isExpCI=S.expandedCI[s.id]===true;
  var rtnTab=(S.rtnTab&&S.rtnTab[s.id])||'check';

  var todaySt=rtnCk(s.id,todayKey,m.id);
  var todayMemo=rtnMemo(s.id,todayKey,m.id);
  var doneCnt=days.filter(function(d){return rtnCk(s.id,toDateKey(d),m.id)==='done';}).length;
  var diaCnt=getRoutineDiamondCount(s.id,m.id);
  var rDeck=routineDeck(s);

  var h='<div style="background:var(--wh);border:1.5px solid '+(todaySt==='done'?'var(--pr)':todaySt==='vacation'?'#3B82F6':'#F3D0E9')+';border-radius:var(--r);overflow:hidden;margin-left:4px;margin-bottom:6px;">';

  // 헤더
  h+='<div style="padding:.75rem 1rem;">';

  if(diaCnt)h+='<span title="누적 다이아 '+diaCnt+'개 (매달 50% 이상 인증 시 1개씩 적립)">💎×'+diaCnt+'</span>';
  h+='<span style="font-size:11px;color:var(--mu);">'+doneCnt+'/7일</span>';
  if(showLeave)h+='<button data-cancel-apply="'+s.id+'" title="스터디 탈퇴" style="border:none;background:none;cursor:pointer;font-size:14px;padding:2px;line-height:1;">🚫</button>';
  h+='<span style="font-size:12px;color:var(--mu);cursor:pointer;" data-expci="'+s.id+'">'+(isExpCI?'▲':'▼')+'</span>';
  h+='</div>';

  // 오늘: 날짜 + 인증/휴가(크게) + 메모(짧게) + (연결된 카드덱 있으면) 카드선택
  h+='<div style="font-size:11px;color:var(--mu);margin-bottom:6px;">오늘 '+toKorDate(today)+'</div>';
  h+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">';
  h+='<button data-rtn-ck="'+s.id+'__'+todayKey+'__'+m.id+'__done" style="flex:1;padding:8px 0;border-radius:var(--rs);border:none;cursor:pointer;font-size:14px;font-weight:700;background:'+(todaySt==='done'?'var(--pr)':'#DCFCE7')+';color:'+(todaySt==='done'?'#fff':'#16A34A')+';">✅ 인증</button>';
  h+='<button data-rtn-ck="'+s.id+'__'+todayKey+'__'+m.id+'__vacation" style="flex:1;padding:8px 0;border-radius:var(--rs);border:none;cursor:pointer;font-size:14px;font-weight:700;background:'+(todaySt==='vacation'?'#2563EB':'#DBEAFE')+';color:'+(todaySt==='vacation'?'#fff':'#2563EB')+';">🏖️ 휴가</button>';
  h+='<input data-rtn-memo="'+s.id+'__'+todayKey+'__'+m.id+'" placeholder="메모" value="'+esc(todayMemo)+'" style="width:80px;flex-shrink:0;font-size:11px;padding:8px 7px;border-radius:var(--rs);border:1px solid var(--br);background:var(--wh);color:var(--tx);" maxlength="30">';
  if(rDeck){
    var todayCards=rtnCards(s.id,todayKey,m.id);
    h+='<button data-rtn-cardpop="'+s.id+'__'+todayKey+'__'+m.id+'" style="flex-shrink:0;padding:8px 10px;border-radius:var(--rs);border:1px solid var(--br);cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;background:'+(todayCards.length?'var(--prl)':'var(--wh)')+';color:'+(todayCards.length?'var(--pr)':'var(--mu)')+';">🗂️'+(todayCards.length?' '+todayCards.length:'')+'</button>';

        var isTodayD=dk===todayKey;

        var rowBg=isTodayD?'var(--prl)':st==='done'?'#F0FDF4':st==='vacation'?'#EFF6FF':'var(--wh)';

          h+='<input data-rtn-memo="'+s.id+'__'+dk+'__'+m.id+'" placeholder="메모..." value="'+esc(memo)+'" style="flex:1;min-width:0;font-size:10px;padding:2px 6px;border-radius:8px;border:1px solid var(--br);background:var(--wh);color:var(--tx);" maxlength="40">';
          if(rDeck){
            var dCards=rtnCards(s.id,dk,m.id);
            h+='<button data-rtn-cardpop="'+s.id+'__'+dk+'__'+m.id+'" style="padding:2px 7px;border-radius:20px;border:1px solid var(--br);cursor:pointer;font-size:10px;font-weight:700;flex-shrink:0;background:'+(dCards.length?'var(--prl)':'var(--wh)')+';color:'+(dCards.length?'var(--pr)':'var(--mu)')+';">🗂️'+(dCards.length?dCards.length:'')+'</button>';
          }
        } else {
          h+='<span style="font-size:10px;color:var(--mu);">예정</span>';

// ── 루틴 월별 달력 모달 ──
function rRoutineCal(sid, mid, ym){
  var s=S.studies.filter(function(x){return x.id===sid;})[0];
  var m=S.members.filter(function(x){return x.id===mid;})[0];
  if(!s||!m)return '';
  var today=new Date();
  var ymKey=ym||(today.getFullYear()+'-'+(today.getMonth()+1+'').padStart(2,'0'));
  var yma=ymKey.split('-');var yr=+yma[0],mo=+yma[1]-1;
  var firstDay=new Date(yr,mo,1).getDay();
  if(firstDay===0)firstDay=7; // 월요일 시작
  firstDay=firstDay-1;
  var lastDate=new Date(yr,mo+1,0).getDate();
  var prevYm=mo===0?(yr-1)+'-12':yr+'-'+(mo+'').padStart(2,'0');
  var nextYm=mo===11?(yr+1)+'-01':yr+'-'+(mo+2+'').padStart(2,'0');
  var canNext=new Date(yr,mo+1,1)<=today;

  var h='<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;" id="rtn-cal-modal">';
  h+='<div style="background:var(--wh);border-radius:var(--r);padding:1.25rem;width:min(360px,92vw);max-height:90vh;overflow-y:auto;">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  h+='<span style="font-size:14px;font-weight:700;color:var(--pr);">📅 '+esc(s.name)+'</span>';
  h+='<button id="rtn-cal-close" style="font-size:18px;background:none;border:none;cursor:pointer;color:var(--mu);">✕</button>';
  h+='</div>';
  h+='<div style="font-size:12px;color:var(--mu);margin-bottom:12px;">'+esc(m.name)+'님의 루틴 현황</div>';
  // 월 네비
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  h+='<button data-rtn-cal-ym="'+prevYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:20px;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;">◀</button>';
  h+='<span style="font-size:13px;font-weight:700;color:var(--pr);">'+yr+'년 '+(mo+1)+'월</span>';
  h+='<button data-rtn-cal-ym="'+nextYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:20px;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;opacity:'+(canNext?'1':'0.3')+';pointer-events:'+(canNext?'auto':'none')+';">▶</button>';
  h+='</div>';
  // 달력 헤더
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">';
  ['월','화','수','목','금','토','일'].forEach(function(d,i){
    h+='<div style="text-align:center;font-size:10px;font-weight:700;color:'+(i>=5?'#EF4444':'var(--mu)')+';">'+d+'</div>';
  });
  h+='</div>';
  // 달력 날짜
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">';
  for(var i=0;i<firstDay;i++)h+='<div></div>';
  var doneCnt=0,totalCnt=lastDate; // 한 달 전체 일수 기준
  for(var d=1;d<=lastDate;d++){
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    var st=rtnCk(sid,dk,mid);
    var dateObj=new Date(yr,mo,d);
    var isFuture=dateObj>today;
    var dow=dateObj.getDay();
    var isWeekend=dow===0||dow===6;
    if(st==='done')doneCnt++;
    var bg=st==='done'?'var(--pr)':st==='vacation'?'#3B82F6':isWeekend?'#FEF2F2':'#F8F9FA';
    var txtCol=st==='done'||st==='vacation'?'#fff':isWeekend?'#EF4444':'var(--tx)';
    var calMemo=rtnMemo(sid,dk,mid);
    var calCards=rtnCards(sid,dk,mid);
    h+='<div style="position:relative;">';
    h+='<div '+((!isFuture)?'data-cal-memo="'+sid+'__'+dk+'__'+mid+'" style="cursor:pointer;"':'style=""')+'>';
    h+='<div style="aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:'+bg+';color:'+txtCol+';'+(isFuture?'opacity:.3':'')+' position:relative;">'+d+'</div>';
    if(calMemo)h+='<div style="position:absolute;bottom:-1px;right:-1px;width:7px;height:7px;background:#F59E0B;border-radius:50%;border:1.5px solid #fff;"></div>';
    if(calCards.length)h+='<div title="'+calCards.length+'장"'+' style="position:absolute;top:-1px;right:-1px;width:7px;height:7px;background:#7B2FF7;border-radius:50%;border:1.5px solid #fff;"></div>';
    h+='</div>';
    h+='</div>';
  }
  h+='</div>';
  // 요약
  var pct=totalCnt?Math.round(doneCnt/totalCnt*100):0;
  h+='<div style="margin-top:12px;padding:.75rem;background:var(--prl);border-radius:var(--rs);text-align:center;">';
  h+='<div style="font-size:13px;font-weight:700;color:var(--pr);">✅ '+doneCnt+'일 달성 / 전체 '+totalCnt+'일 · '+pct+'%</div>';
  h+='</div>';
  h+='</div></div>';
  h+=rCalMemoPopup();
  return h;
}
// 날짜 메모 팝업 (내 현황 미니달력 / 멤버 현황 달력 공용)

// 루틴 카드 선택 UI (검색 + 체크박스 목록). 메모 팝업 / 전용 카드 팝업 공용

// 루틴 카드 노출 통계 (몇 회, 언제) - 내 현황 / 전체현황 공용
function rRoutineCardStatsHtml(sid,mid,deck){
  if(!deck)return '';
  var stats=rtnCardStats(sid,mid);
  var cards=deck.cards||[];
  var rows=cards.filter(function(c){return stats[c.id];}).map(function(c){
    return{name:c.name,count:stats[c.id].count,dates:stats[c.id].dates};
  }).sort(function(a,b){return b.count-a.count||a.name.localeCompare(b.name);});
  var h='<div style="margin-top:10px;padding-top:10px;border-top:1px solid #F3D0E9;">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--pr);margin-bottom:6px;">🗂️ '+esc(deck.name)+' 노출 통계 · '+rows.length+'/'+cards.length+'장</div>';
  if(!rows.length){
    h+='<div style="font-size:12px;color:var(--mu);text-align:center;padding:.5rem;">아직 노출한 카드가 없어요</div>';
  } else {
    h+='<div style="max-height:220px;overflow-y:auto;border:1px solid #F3D0E9;border-radius:8px;padding:.3rem .5rem;">';
    rows.forEach(function(r){
      var dstr=r.dates.map(function(d){var p=d.split('-');return (+p[1])+'/'+(+p[2]);}).join(', ');
      h+='<div style="padding:.3rem 0;border-bottom:1px solid #F9F9F9;">';
      h+='<div style="display:flex;align-items:center;gap:6px;"><span style="flex:1;font-size:12px;font-weight:600;color:var(--tx);">'+esc(r.name)+'</span><span style="font-size:11px;font-weight:700;color:var(--pr);white-space:nowrap;">'+r.count+'회</span></div>';
      h+='<div style="font-size:10px;color:var(--mu);margin-top:1px;">'+esc(dstr)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function sdWkInfo(s,w,m){
  var status=ck(s.id,w.num,m.id),isOpen=!w.locked,curWk=getCurrentWeek(s);
  var aw=allWeeks(s);
  var prevW=aw.filter(function(x){return x.num===w.num-1;})[0];
  var prevCk=prevW?ck(s.id,prevW.num,m.id):null;
  var hasMat=!!(w.materialUrl&&w.materialUrl.trim()!=='');
  var prevCkDone=(w.num===1)||(prevW!==undefined&&prevCk==='done');
  var isThisWeekOrBefore=curWk<=0||(w.num<=curWk);
  return{status:status,isOpen:isOpen,curWk:curWk,isCur:curWk>0&&w.num===curWk,isFuture:curWk>0&&w.num>curWk,
    isOldPast:curWk>0&&w.num<curWk-1,hasMat:hasMat,matUnlocked:hasMat&&prevCkDone&&isThisWeekOrBefore,
    title:(w.note&&w.note.trim())?w.note.split('\n')[0].replace(/^[\s□☐■▢]+/,''):''};
}

function impBuildPlan(raw,pairs){
  var V=raw.vip||{},N=raw.nw||{},cl=function(o){return JSON.parse(JSON.stringify(o));};
  var rep={autoMerged:[],manualMerged:[],newOnly:[],sidRenamed:0,midRenamed:0,ckV:0,ckN:0,ckSkipped:0,ckConflict:0};
  // 스터디
  var vS=impArr(V.studies).map(cl),nS=impArr(N.studies).map(cl);
  var used={};vS.forEach(function(s){used[s.id]=1;});
  var sidMap={};
  nS.forEach(function(s){var nid=s.id;if(used[nid]){nid='n_'+s.id;while(used[nid])nid+='x';rep.sidRenamed++;}used[nid]=1;sidMap[s.id]=nid;});
  vS.forEach(function(s){if(!s.tiers)s.tiers=['vip','clover'];});
  nS.forEach(function(s){
    s.id=sidMap[s.id];s.tiers=['new'];
    if(s.routineDeckId&&s.routineDeckId.indexOf('__')>0){var p=s.routineDeckId.split('__');if(sidMap[p[0]])p[0]=sidMap[p[0]];s.routineDeckId=p.join('__');}
  });
  // 멤버
  var vM=impArr(V.members).map(cl),nM=impArr(N.members).map(cl);
  var vById={},vByNick={},usedM={};
  vM.forEach(function(m){m.tier=m.tier||'vip';vById[m.id]=m;vByNick[nickNorm(m.name)]=m;usedM[m.id]=1;});
  var midMap={},outNew=[];
  nM.forEach(function(m){
    var origId=m.id,target=null,how='';
    if(pairs[m.id]!==undefined){if(pairs[m.id])target=vById[pairs[m.id]];how='manual';}
    else{target=vByNick[nickNorm(m.name)]||null;how='auto';}
    var sids=(m.studyIds||[]).map(function(x){return sidMap[x];}).filter(Boolean);
    if(target){
      midMap[m.id]=target.id;
      target.studyIds=target.studyIds||[];
      sids.forEach(function(x){if(target.studyIds.indexOf(x)<0)target.studyIds.push(x);});
      (how==='auto'?rep.autoMerged:rep.manualMerged).push({nw:m.name,vip:target.name,nid:m.id});
    }else{
      var nid=m.id;if(usedM[nid]){nid='n_'+m.id;while(usedM[nid])nid+='x';rep.midRenamed++;}usedM[nid]=1;
      midMap[m.id]=nid;m.id=nid;m.tier='new';m.studyIds=sids;outNew.push(m);
      rep.newOnly.push({nw:m.name,nid:origId});
    }
  });
  var members=vM.concat(outNew);
  var usedL={};
  members.forEach(function(m){
    var base=m.loginId||m.name||m.id,l=base,k=2;
    while(usedL[idNorm(l)]){l=base+'_'+k;k++;}
    if(l!==base)rep.idRenamed=(rep.idRenamed||[]).concat([m.name+' → '+l]);
    usedL[idNorm(l)]=1;m.loginId=l;
  });
  // 인증 기록 (키 형식: 스터디id__...__멤버id)
  var ck={};
  Object.keys(V.checkins||{}).forEach(function(k){ck[k]=V.checkins[k];rep.ckV++;});
  Object.keys(N.checkins||{}).forEach(function(k){
    var p=k.split('__');if(p.length<3){rep.ckSkipped++;return;}
    var sid=sidMap[p[0]],mid=midMap[p[p.length-1]];
    if(!sid||!mid){rep.ckSkipped++;return;}
    p[0]=sid;p[p.length-1]=mid;var nk=p.join('__');
    if(ck[nk]!==undefined){rep.ckConflict++;return;}
    ck[nk]=N.checkins[k];rep.ckN++;
  });
  // 카테고리 순서 / 휴강주
  var catOrder=(V.catOrder||[]).slice();(N.catOrder||[]).forEach(function(c){if(catOrder.indexOf(c)<0)catOrder.push(c);});
  var sw=impArr(V.skipWeeks).map(cl);
  impArr(N.skipWeeks).forEach(function(x){if(!sw.some(function(y){return y.id===x.id||(y.startDate===x.startDate&&y.endDate===x.endDate);}))sw.push(cl(x));});
  // 일정 / 공지
  var tagMerge=function(a,b,ta,tb){
    var out={};
    Object.keys(a||{}).forEach(function(k){var o=cl(a[k]);if(!o.tiers)o.tiers=ta;out[k]=o;});
    Object.keys(b||{}).forEach(function(k){var o=cl(b[k]);o.tiers=tb;var nk=k;while(out[nk])nk='n_'+nk;o.id=nk;out[nk]=o;});
    return out;
  };
  var events=tagMerge(V.events,N.events,['vip','clover'],['new']);
  var notices=tagMerge(raw.vipNotices,raw.nwNotices,['vip','clover'],['new']);
  return{studies:vS.concat(nS),members:members,checkins:ck,catOrder:catOrder,skipWeeks:sw,events:events,notices:notices,report:rep,
    counts:{vS:vS.length,nS:nS.length,vM:vM.length,nM:nM.length,ev:Object.keys(events).length,nt:Object.keys(notices).length}};
}

      '<div style="font-size:13px;font-weight:600;color:var(--pr);margin-bottom:8px;">+ 일정 추가</div>'+

          '<input type="date" id="ev-end" class="ainp" style="width:100%;padding:.5rem .75rem;font-size:13px;"></div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;">'+
          '<select id="ev-color" style="flex:1;padding:.6rem .75rem;border-radius:var(--rs);border:1.5px solid var(--br);font-size:13px;background:var(--wh);margin:0;">'+
            '<option value="#E91E8C">🩷 분홍</option>'+
            '<option value="#3B82F6">💙 파랑</option>'+
            '<option value="#22C55E">💚 초록</option>'+
            '<option value="#F59E0B">🧡 주황</option>'+
            '<option value="#7B2FF7">💜 보라</option>'+
          '</select>'+
          '<button class="abtn" id="ev-add">추가</button>'+
        '</div>'+
        '<div style="margin-top:6px;">'+tierPickHtml('ev')+'</div>'+
      '</div></div>';
  }

  // 달력 그리드
  h+='<div style="background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);overflow:hidden;">';
  // 요일 헤더
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);background:var(--prl);">';
  dayNames.forEach(function(d,i){
    h+='<div style="text-align:center;padding:.5rem 0;font-size:12px;font-weight:700;color:'+(i===0?'var(--rd)':i===6?'var(--bl)':'var(--tx)')+';">'+d+'</div>';
  });
  h+='</div>';
  // 날짜 그리드
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);">';
  for(var i=0;i<firstDay;i++) h+='<div style="min-height:60px;border-top:1px solid #F9EDF5;"></div>';
  for(var d=1;d<=lastDate;d++){
    var dateStr=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dayEvs=Object.values(S.events).filter(visibleToMe).filter(function(e){
      var s=e.startDate||e.date;var en=e.endDate||s;
      return dateStr>=s&&dateStr<=en;
    });
    var isToday=dateStr===todayStr;
    var dow=(firstDay+d-1)%7;
    h+='<div style="min-height:60px;border-top:1px solid #F9EDF5;padding:3px;'+(isToday?'background:var(--prl);':'')+'">'+
      '<div style="font-size:12px;font-weight:'+(isToday?'700':'400')+';color:'+(isToday?'var(--pr)':dow===0?'var(--rd)':dow===6?'var(--bl)':'var(--tx)')+';margin-bottom:2px;">'+d+'</div>';
    dayEvs.forEach(function(ev){
      var s=ev.startDate||ev.date;var en=ev.endDate||s;
      var isStart=dateStr===s;var isEnd=dateStr===en;var isSingle=s===en;
      var br=isSingle?'4px':(isStart?'4px 0 0 4px':(isEnd?'0 4px 4px 0':'0'));
      var label=isStart?esc(ev.title.length>8?ev.title.slice(0,8)+'...':ev.title):'';
      h+='<div style="font-size:10px;font-weight:600;color:#fff;background:'+ev.color+';border-radius:'+br+';padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:'+(isStart?1:0.75)+';" title="'+esc(ev.title)+'">'+
        label+
        (S.isAdmin&&(isStart||isSingle)?'<span class="ev-del" data-evid="'+ev.id+'" style="float:right;cursor:pointer;opacity:.7;margin-left:2px;">✕</span>':'')+
      '</div>';
    });
    h+='</div>';
  }
  h+='</div></div>';

  // 이번달 일정 목록
  var moPrefix=yr+'-'+String(mo+1).padStart(2,'0');
  var moEvs=Object.values(S.events).filter(visibleToMe).filter(function(e){
    var s=e.startDate||e.date;var en=e.endDate||s;
    return s.startsWith(moPrefix)||en.startsWith(moPrefix)||(s<moPrefix&&en>moPrefix+'-31');
  }).sort(function(a,b){var sa=a.startDate||a.date;var sb=b.startDate||b.date;return sa>sb?1:-1;});
  if(moEvs.length){
    h+='<div style="background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);padding:.875rem 1rem;">'+
      '<div style="font-size:13px;font-weight:700;color:var(--pr);margin-bottom:8px;">이번 달 일정</div>';
    moEvs.forEach(function(ev){
      var sd=ev.startDate||ev.date;var ed=ev.endDate||sd;
      var d1=new Date(sd);var dow2=d1.getDay();
      var dowName=['일','월','화','수','목','금','토'][dow2];
      var dateDisplay=sd===ed?sd.slice(5).replace('-','/')+'('+dowName+')':sd.slice(5).replace('-','/') + ' ~ ' + ed.slice(5).replace('-','/');
      h+='<div style="display:flex;align-items:center;gap:8px;padding:.4rem 0;border-bottom:1px solid #F9EDF5;">'+
        '<div style="width:10px;height:10px;border-radius:50%;background:'+ev.color+';flex-shrink:0;"></div>'+
        '<span style="font-size:12px;color:var(--mu);white-space:nowrap;">'+dateDisplay+'</span>'+
        '<span style="font-size:13px;font-weight:500;flex:1;">'+esc(ev.title)+'</span>'+
        (S.isAdmin?'<button class="ev-del" data-evid="'+ev.id+'" style="font-size:11px;padding:2px 6px;border-radius:20px;border:1.5px solid #FECACA;background:#FFF5F5;color:var(--rd);cursor:pointer;">삭제</button>':'')+
      '</div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

  if(!S.isAdmin)return rAL();

    if(vm){

      var vmCats=[];
      (S.catOrder.length?S.catOrder:vmy.map(function(s){return s.cat;})).forEach(function(c){

        var catStudies=vmy.filter(function(s){return s.cat===cat;});

        var vmCatKey=vm.id+'__'+cat;

          '<span style="font-size:12px;color:rgba(255,255,255,.8);">'+(vmCatOpen?'▲':'▼')+'</span>'+
        '</div>';
        if(!vmCatOpen)return;
        catStudies.forEach(function(s){
          var aw=allWeeks(s);
          var vmStKey=vm.id+'__'+s.id;
          var vmStOpen=S.expandedVmSt[vmStKey]===true;
          var doneC=aw.filter(function(w){return ck(s.id,w.num,vm.id)==='done';}).length;
          var vacC=aw.filter(function(w){return ck(s.id,w.num,vm.id)==='vacation';}).length;
          // 스터디 헤더 (토글)
          h+='<div style="border:1.5px solid var(--br);border-radius:var(--rs);margin-bottom:6px;overflow:hidden;">';

            '<span style="flex:1;font-size:13px;font-weight:600;color:var(--tx);">'+esc(s.name)+'</span>'+
            '<span style="font-size:11px;color:var(--mu);">✅'+doneC+' 🏖️'+vacC+'/'+aw.length+'주</span>'+
            '<span style="font-size:12px;color:var(--mu);margin-left:4px;">'+(vmStOpen?'▲':'▼')+'</span>'+
          '</div>';
          if(vmStOpen){
            h+='<div style="background:#FAFAFA;padding:.5rem .75rem;">';
            aw.forEach(function(w){
              var status=ck(s.id,w.num,vm.id);var isOpen=!w.locked;
              var cwk=getCurrentWeek(s);var isCW=cwk>0&&w.num===cwk;
              h+='<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #F3F4F6;">';
              h+='<span class="wk-chip '+(isOpen?'wk-open':'wk-locked')+(isCW?' wk-curweek':'')+'" style="font-size:11px;min-width:60px;">'+(isCW?'⭐ ':'')+w.num+'주차</span>';

      wks.forEach(function(w){

          rows.push({mem:m.name,mid:m.id,study:s.name,sid:s.id,cat:s.cat,week:w.num,tw:aw.length,locked:w.locked,st:ck(s.id,w.num,m.id)});

function xCsv(){
  var rows=bRows();var lines=[['멤버','스터디','카테고리','주차','총주차','잠금','상태'].join(',')];
  rows.forEach(function(r){

}

function bAll(){
  qsa('[data-tab]',function(el){el.addEventListener('click',function(){
    S.tab=el.dataset.tab;S.chgErr='';S.chgOk='';S.ciDetail=null;setTimeout(function(){window.scrollTo(0,0);},0);
    // 멤버 탭만 기억 (관리자 탭 제외)
    var memTabs=['ci','mp','apply','notice','cal','cp'];
    if(memTabs.indexOf(S.tab)>=0){
      try{localStorage.setItem('kkang_last_tab',S.tab);}catch(e){}
    }
    render();
  });});
  on('mlb',function(){S.tab='mlogin';render();});on('alb',function(){S.tab='alogin';render();});
  on('lo',function(){if(S.impersonating){var b=g('imp-exit');if(b){b.click();return;}}S.impersonating=false;S.isAdmin=false;S.loggedMember=null;S.tab='mlogin';S.home=true;try{localStorage.removeItem('kkang_member_id');}catch(e){}render();});
  // 이미지 에러 처리
  qsa('.notice-img',function(el){el.addEventListener('error',function(){el.style.display='none';});});
  // 이미지 파일 업로드
  var ntImgData='';
  function compressImage(file,cb){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var MAX=900;var w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
        var out=cv.toDataURL('image/jpeg',0.6);
        if(out.length>500000){out=cv.toDataURL('image/jpeg',0.4);}
        if(out.length>700000){alert('이미지가 너무 커요. 더 작은 이미지를 사용해주세요.');return;}
        cb(out);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function setNtPreview(dataUrl){
    ntImgData=dataUrl;
    var prev=g('nt-preview');var pimg=g('nt-preview-img');
    if(prev&&pimg){pimg.src=dataUrl;prev.style.display='block';}
    var drop=g('nt-drop');if(drop)drop.style.display='none';
  }
  var ntDrop=g('nt-drop');var ntFile=g('nt-file');
  if(ntDrop){
    ntDrop.addEventListener('click',function(){if(ntFile)ntFile.click();});
    ntDrop.addEventListener('dragover',function(e){e.preventDefault();ntDrop.style.borderColor='var(--pr)';});
    ntDrop.addEventListener('dragleave',function(){ntDrop.style.borderColor='var(--br)';});
    ntDrop.addEventListener('drop',function(e){
      e.preventDefault();ntDrop.style.borderColor='var(--br)';
      var f=e.dataTransfer.files[0];
      if(f&&f.type.startsWith('image/')){
        var up=g('nt-uploading');if(up)up.style.display='block';
        compressImage(f,function(d){if(up)up.style.display='none';setNtPreview(d);});
      }
    });
  }
  if(ntFile){ntFile.addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;
    var up=g('nt-uploading');if(up)up.style.display='block';
    compressImage(f,function(d){if(up)up.style.display='none';setNtPreview(d);});
  });}
  on('nt-clear-img',function(){
    ntImgData='';
    var prev=g('nt-preview');var drop=g('nt-drop');
    if(prev)prev.style.display='none';if(drop)drop.style.display='block';
    if(ntFile)ntFile.value='';
  });
  // 공지 등록
  on('nt-add',function(){
    var ti=g('nt-title');var bo=g('nt-body');
    if(!ti||!ti.value.trim()){alert('제목을 입력해주세요');return;}
    var id='nt'+Date.now().toString(36);
    var lu=g('nt-link-url'),ll=g('nt-link-label');
    S.notices[id]={id:id,title:ti.value.trim(),body:bo?bo.value.trim():'',imageUrl:ntImgData,linkUrl:lu?lu.value.trim():'',linkLabel:ll?ll.value.trim():'',createdAt:Date.now(),tiers:(function(t){return t.length>=TIERS.length?null:t;})(readTierPick('nt'))};
    ti.value='';if(bo)bo.value='';ntImgData='';
    var prev=g('nt-preview');var drop=g('nt-drop');
    if(prev)prev.style.display='none';if(drop)drop.style.display='block';
    if(ntFile)ntFile.value='';
    persistNotices();
  });
  // 공지 토글
  qsa('[data-nttog]',function(el){el.addEventListener('click',function(){
    var id=el.dataset.nttog;S.expandedNotice[id]=!S.expandedNotice[id];render();
  });});
  // 공지 수정 버튼
  qsa('[data-ntedit]',function(el){el.addEventListener('click',function(e){
    e.stopPropagation();S.editNoticeId=el.dataset.ntedit;render();
  });});
  // 수정 취소
  qsa('[data-ntcanceledit]',function(el){el.addEventListener('click',function(){
    S.editNoticeId=null;render();
  });});
  // 수정 저장
  qsa('[data-ntsave]',function(el){el.addEventListener('click',function(){
    var id=el.dataset.ntsave;
    var ti=document.getElementById('nt-edit-title-'+id);
    var bo=document.getElementById('nt-edit-body-'+id);
    if(!ti||!ti.value.trim()){alert('제목을 입력해주세요');return;}
    var n=S.notices[id];if(!n)return;
    n.title=ti.value.trim();n.body=bo?bo.value:'';
    S.editNoticeId=null;S.expandedNotice[id]=true;persistNotices();
  });});
  qsa('[data-ntdel]',function(el){el.addEventListener('click',function(){
    if(!confirm('이 공지를 삭제할까요?'))return;
    delete S.notices[el.dataset.ntdel];persistNotices();
  });});

      open.forEach(function(w){setCk(sid,w.num,m.id,'done');patch[ckKey(sid,w.num,m.id)]='done';});

  });});
  qsa('[data-sasgn]',function(el){el.addEventListener('change',function(e){
    var p=e.target.dataset.sasgn.split('__');var sid=p[0],mid=p[1];
    var m=S.members.filter(function(x){return x.id===mid;})[0];if(!m)return;
    m.studyIds=m.studyIds||[];

  on('go-signup',function(){S.tab='signup';S.signupDone='';S.suErr='';S.suForm={};render();});
  on('su-back',function(){S.tab='mlogin';S.signupDone='';S.suErr='';render();});
  on('su-submit',async function(){
    var v=function(id){var e=g(id);return e?e.value:'';};
    var lid=idNorm(v('su-id')),pw=v('su-pw'),pw2=v('su-pw2'),mom=v('su-mom').trim(),insta=v('su-insta').trim().replace(/^@/,'');
    S.suForm={lid:lid,mom:mom,insta:insta};
    if(!/^[a-z0-9._]{4,20}$/.test(lid)){S.suErr='아이디는 영문 소문자·숫자(._ 가능) 4~20자로 만들어주세요';render();return;}
    if(idTaken(lid)){S.suErr='이미 사용 중인 아이디예요. 다른 아이디를 써주세요';render();return;}
    if(pw.length<4){S.suErr='비밀번호를 4자 이상 입력해주세요';render();return;}
    if(pw!==pw2){S.suErr='비밀번호 확인이 일치하지 않아요';render();return;}
    if(!mom){S.suErr='닉네임(00맘)을 입력해주세요';render();return;}
    if(!insta){S.suErr='인스타 아이디를 입력해주세요';render();return;}
    var id=uid(),rec={id:id,loginId:lid,momName:mom,insta:insta,name:dispName(mom,insta),createdAt:Date.now()};
    try{rec.pwh=await hashPw(id,pw);}catch(e){S.suErr='이 브라우저에서는 가입이 어려워요. 다른 브라우저로 열어주세요.';render();return;}
    var o={};o[id]=rec;
    try{await fbPatchPath('signups',o);}catch(e){S.suErr='신청 저장에 실패했어요. 인터넷 연결을 확인해주세요';render();return;}
    S.signups[id]=rec;S.signupDone=rec.name;S.signupDoneId=lid;S.suErr='';S.suForm={};render();
  });
  on('pf-save',function(){
    var v=function(id){var e=g(id);return e?e.value:'';};
    var mom=v('pf-mom').trim(),insta=v('pf-insta').trim().replace(/^@/,''),lid=v('pf-id').trim();
    S.pfForm={mom:mom,insta:insta,lid:lid};
    var m=S.members.filter(function(x){return x.id===S.loggedMember.id;})[0]||S.loggedMember;
    if(!mom){S.pfErr='닉네임(00맘)을 입력해주세요';render();return;}
    if(!insta){S.pfErr='인스타 아이디를 입력해주세요';render();return;}
    if(!lid){S.pfErr='아이디를 입력해주세요';render();return;}
    if(idTaken(lid,m.id)){S.pfErr='이미 사용 중인 아이디예요';render();return;}
    m.momName=mom;m.insta=insta;m.loginId=lid;m.name=dispName(mom,insta);
    S.loggedMember=m;S.pfErr='';S.pfForm=null;
    S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return 0;}});
    persist();showToast('✨ 프로필 저장 완료!','success');
  });
  // 관리자: 멤버 계정으로 접속
  qsa('[data-impers]',function(el){el.addEventListener('click',function(){
    var m=S.members.filter(function(x){return x.id===el.dataset.impers;})[0];if(!m)return;
    S.impersonating=true;S.isAdmin=false;S.loggedMember=m;S.ciDetail=null;S.tab='ci';render();window.scrollTo(0,0);
  });});
  on('imp-exit',function(){S.impersonating=false;S.loggedMember=null;S.isAdmin=true;S.tab='settings';S.settingsTab='member';S.ciDetail=null;render();});
  qsa('[data-alid]',function(el){el.addEventListener('click',function(){
    var m=S.members.filter(function(x){return x.id===el.dataset.alid;})[0];if(!m)return;
    var inp=g('alid'+m.id);var nv=inp?inp.value.trim():'';
    if(!nv){alert('아이디를 입력해주세요');return;}
    if(idTaken(nv,m.id)){alert('이미 사용 중인 아이디예요');return;}
    m.loginId=nv;persist();alert(shortName(m)+'님 아이디 → '+nv);
  });});
  qsa('[data-gopending]',function(el){el.addEventListener('click',function(){S.tab='settings';S.settingsTab='member';render();window.scrollTo(0,0);});});
  qsa('[data-approve]',function(el){el.addEventListener('click',async function(){
    var p=el.dataset.approve.split('__'),sid=p[0],tier=p[1];
    var su=S.signups[sid];if(!su)return;
    if(S.members.some(function(x){return idNorm(memLoginId(x))===idNorm(su.loginId);})){alert('같은 아이디의 멤버가 이미 있어요. 거절 후 다른 아이디로 다시 신청해 달라고 해주세요.');return;}
    var sids=[];document.querySelectorAll('.pa-'+sid+':checked').forEach(function(cb){sids.push(cb.value);});
    var snames=S.studies.filter(function(s){return sids.indexOf(s.id)>=0;}).map(function(s){return s.name;});
    if(!confirm(su.name+'님을 '+tierOf(tier).ic+' '+tierOf(tier).label+' 멤버로 승인할까요?\n\n배정 스터디: '+(snames.length?snames.join(', '):'없음')))return;
    S.members.push({id:su.id,loginId:su.loginId,momName:su.momName,insta:su.insta||'',name:su.name,pwh:su.pwh,tier:tier,studyIds:sids,joinedAt:Date.now()});
    S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return 0;}});
    await persist();
    var o={};o[sid]=null;try{await fbPatchPath('signups',o);}catch(e){}
    delete S.signups[sid];showToast('✅ '+su.name+'님 승인 완료','success');render();
  });});
  qsa('[data-reject]',function(el){el.addEventListener('click',async function(){
    var sid=el.dataset.reject,su=S.signups[sid];if(!su)return;
    if(!confirm(su.name+'님의 가입 신청을 거절(삭제)할까요?'))return;
    var o={};o[sid]=null;
    try{await fbPatchPath('signups',o);}catch(e){alert('저장 실패. 인터넷 연결을 확인해주세요.');return;}
    delete S.signups[sid];render();
  });});
  qsa('[data-mtier]',function(el){el.addEventListener('change',function(){
    var m=S.members.filter(function(x){return x.id===el.dataset.mtier;})[0];if(!m)return;
    var prev=memTier(m);m.tier=el.value;
    if(!confirm(m.name+'님 등급을 '+tierOf(prev).label+' → '+tierOf(el.value).label+'(으)로 바꿀까요?\n인증 내역과 스터디 기록은 그대로 유지돼요.')){m.tier=prev;render();return;}
    persist();showToast(tierOf(el.value).ic+' '+m.name+'님 '+tierOf(el.value).label+' 전환','success');
  });});
  qsa('[data-mtfilter]',function(el){el.addEventListener('click',function(){S.memTierFilter=el.dataset.mtfilter;render();});});
  qsa('.tp-st',function(el){el.addEventListener('change',function(){
    var s=S.studies.filter(function(x){return x.id===el.dataset.sid;})[0];if(!s)return;
    var v=[];document.querySelectorAll('.tp-st[data-sid="'+s.id+'"]:checked').forEach(function(cb){v.push(cb.value);});
    if(!v.length){alert('최소 한 등급은 선택해야 해요');el.checked=true;return;}
    s.tiers=v.length>=TIERS.length?null:v;persist();
  });});
  on('imp-load',function(){impLoad();});
  on('imp-backup',function(){impBackup();});
  on('imp-run',function(){impRun();});
  on('imp-reset',function(){S.imp={stage:'idle'};render();});
  qsa('[data-imppair]',function(el){el.addEventListener('change',function(){S.imp.pairs[el.dataset.imppair]=el.value;impReplan();});});
}
function doAM(){
  var n=S.newMember.trim();if(!n){render();return;}
  if(S.members.filter(function(m){return m.name===n;}).length){alert('이미 같은 이름의 멤버가 있어요!');return;}
  var idEl=document.getElementById('nm-id');var lid=idEl&&idEl.value.trim()?idEl.value.trim():n;
  if(idTaken(lid)){alert('이미 사용 중인 아이디예요: '+lid);return;}
  var pwEl=document.getElementById('nm-pw');
  var pw=pwEl&&pwEl.value.trim()?pwEl.value.trim():'0000';
  var cbs=document.querySelectorAll('.nm-study-cb:checked');
  var studyIds=[];cbs.forEach(function(cb){studyIds.push(cb.value);});
  var tEl=document.getElementById('nm-tier');
  var nm={id:uid(),name:n,loginId:lid,tier:tEl?tEl.value:'new',studyIds:studyIds,joinedAt:Date.now()};
  var _mp=n.split('/');if(_mp.length===2&&_mp[0].trim()&&_mp[1].trim()){nm.momName=_mp[0].trim();nm.insta=_mp[1].trim().replace(/^@/,'');}
  S.members.push(nm);
  S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return a.name<b.name?-1:a.name>b.name?1:0;}});
  S.newMember='';
  setPw(nm,pw).then(persist).catch(function(){nm.pw=pw;persist();});
}
function doDM(id){
  if(!confirm('이 멤버를 삭제할까요?'))return;
  S.members=S.members.filter(function(m){return m.id!==id;});
  if(S.expandedMem===id)S.expandedMem=null;persist();
}
async function persist(){
  S.saving=true;
  // 체크인은 별도(persistCk/fbPatchCheckins)로만 저장하며, 여기서는 절대 건드리지 않는다.
  // (동시 접속 중인 다른 사용자의 체크인을 오래된 로컬 스냅샷으로 덮어쓰는 것을 방지)
  try{await fetch(FIREBASE_URL+DB_PATH,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({studies:S.studies,members:S.members,catOrder:S.catOrder,events:S.events,skipWeeks:S.skipWeeks})}).then(function(r){if(!r.ok)throw new Error(r.status);});}
  catch(e){alert('저장 실패. 인터넷 연결을 확인해주세요.');}
  S.saving=false;render();
}
async function persistNotices(){
  try{await fbSaveNotices(S.notices);}
  catch(e){alert('공지 저장 실패. 인터넷 연결을 확인해주세요.');}
  render();
}
function applyData(d){
  S.studies=d&&d.studies&&d.studies.length?d.studies:JSON.parse(JSON.stringify(DEFAULT_STUDIES));
  var dbMems=d&&d.members&&d.members.length?d.members:[];
  if(dbMems.length){
    var exIds=dbMems.map(function(m){return m.id;});var exNames=dbMems.map(function(m){return m.name;});
    DEFAULT_MEMBERS.forEach(function(dm){if(exIds.indexOf(dm.id)<0&&exNames.indexOf(dm.name)<0)dbMems.push(JSON.parse(JSON.stringify(dm)));});
    S.members=dbMems;
  } else {S.members=JSON.parse(JSON.stringify(DEFAULT_MEMBERS));}
  S.checkins=d&&d.checkins?d.checkins:{};
  S.signups=d&&d.signups?d.signups:{};
  S.studies.forEach(function(s){
    if(!s.weeks||!s.weeks.length)s.weeks=[{num:1,locked:false,materialUrl:''}];
    if(s.applyOpen===undefined)s.applyOpen=false;
    if(s.dayOfWeek===undefined)s.dayOfWeek='';
    if(s.bandUrl===undefined)s.bandUrl='';
    if(s.startDate===undefined)s.startDate='';
    if(!s.snotices)s.snotices=[];
    if(!s.cardDecks)s.cardDecks=[];
    s.cardDecks.forEach(function(cd){if(!cd.cards)cd.cards=[];});
    s.weeks.forEach(function(w){if(w.materialUrl===undefined)w.materialUrl='';if(w.note===undefined)w.note='';});
  });
  // catOrder: Firebase에 저장된 순서 로드, 없으면 studies에서 추출
  var allCats=[];S.studies.forEach(function(s){if(allCats.indexOf(s.cat)<0)allCats.push(s.cat);});
  var savedOrder=d&&d.catOrder&&d.catOrder.length?d.catOrder:[];
  // 저장된 순서 기준으로 정렬, 새 카테고리는 맨 뒤에 추가
  S.events=d&&d.events?d.events:{};
  S.skipWeeks=d&&d.skipWeeks?d.skipWeeks:[];
  // 루틴 체크 카테고리 항상 포함
  if(allCats.indexOf('루틴 체크')<0)allCats.unshift('루틴 체크');
  S.catOrder=savedOrder.filter(function(c){return allCats.indexOf(c)>=0;});
  allCats.forEach(function(c){if(S.catOrder.indexOf(c)<0)S.catOrder.push(c);});
  // 루틴 체크가 catOrder에 없으면 맨 앞에 추가
  if(S.catOrder.indexOf('루틴 체크')<0)S.catOrder.unshift('루틴 체크');
  S.members.sort(function(a,b){try{return a.name.localeCompare(b.name,'ko');}catch(e){return a.name<b.name?-1:a.name>b.name?1:0;}});
  // 자동 로그인: 이 기기에서 마지막으로 로그인했던 멤버가 있으면 비번 없이 바로 로그인
  try{
    var savedMid=localStorage.getItem('kkang_member_id');
    if(savedMid){
      var savedM=S.members.filter(function(x){return x.id===savedMid;})[0];
      if(savedM){
        S.loggedMember=savedM;
        var lt=localStorage.getItem('kkang_last_tab');
        S.tab=(lt&&['ci','mp','apply','notice','cal','cp'].indexOf(lt)>=0)?lt:'ci';
      } else {
        localStorage.removeItem('kkang_member_id');S.home=true;
      }
    }
  }catch(e){}
  S.loading=false;render();
}
(async function(){
  render();
  var coreData=null;
  try{coreData=await fbLoad();}
  catch(e1){
    // 1회 재시도
    try{await new Promise(function(r){setTimeout(r,1500);});coreData=await fbLoad();}
    catch(e2){
      S.loading=false;
      var app=document.getElementById('app');
      if(app)app.innerHTML='<div class="loading">로드 실패. 인터넷 연결을 확인하고 새로고침해주세요.<br><br><button onclick="location.reload()" style="padding:.6rem 1.25rem;border-radius:20px;background:linear-gradient(135deg,#E91E8C,#7B2FF7);color:#fff;border:none;font-weight:700;cursor:pointer;">새로고침</button></div>';
      return;
    }
  }
  applyData(coreData);
  // 공지(이미지 포함)는 별도 경로에서 비동기로, 실패해도 앱은 정상 작동
  fbLoadNotices().then(function(nd){S.notices=nd||{};render();}).catch(function(){S.notices={};});
})();


</script>
