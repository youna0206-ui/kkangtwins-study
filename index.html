<style>:root{--pr:#E91E8C;--prl:#FDE8F4;--bl:#3B82F6;--bll:#EFF6FF;--bld:#2563EB;--gr:#22C55E;--grb:#F0FDF4;--or:#F59E0B;--orb:#FFFBEB;--rd:#EF4444;--bg:#FDF5FB;--bgd:#FAE8F5;--wh:#fff;--tx:#2D2D2D;--mu:#9CA3AF;--br:#F3D0E9;--r:14px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;min-height:100vh;padding-bottom:2.5rem}
.wrap{max-width:520px;margin:0 auto;padding:.75rem}
.hd{background:linear-gradient(135deg,#E91E8C,#7B2FF7 60%,#3B82F6);border-radius:22px;padding:1.25rem 1.5rem;margin-bottom:1rem;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 6px 24px rgba(233,30,140,.25)}
.hd-left .hd-tag{font-size:11px;opacity:.85;letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.hd-left .hd-title{font-size:20px;font-weight:700}
.hd-sub{margin-top:6px;font-size:12px;opacity:.8}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;margin-top:2px}
.hd-user{background:rgba(255,255,255,.25);border-radius:16px;padding:3px 10px;font-size:12px;font-weight:600}
.hd-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem;padding-bottom:2px}
.tab{flex:0 0 auto;padding:.45rem .75rem;border-radius:20px;border:1.5px solid var(--br);background:var(--wh);color:var(--mu);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,var(--pr),#7B2FF7);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 2px 10px rgba(233,30,140,.3)}
.tab.at{border-color:#CDDFFE;color:var(--bl)}
.tab.at.on{background:linear-gradient(135deg,var(--bl),#7B2FF7);color:#fff;border-color:transparent}

// ── 비밀번호: SHA-256 해시로 저장 (원문 저장 안 함) ──
async function hashPw(mid,pw){
  if(!(window.crypto&&crypto.subtle))throw new Error('no-crypto');
  var buf=new TextEncoder().encode('kkang|'+mid+'|'+pw);
  var h=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function checkPw(m,pw){
  if(!m||!pw)return false;
  if(m.pwh)return m.pwh===await hashPw(m.id,pw);
  return m.pw!==undefined&&String(m.pw)===pw;
}
async function setPw(m,pw){m.pwh=await hashPw(m.id,pw);delete m.pw;}

async function findMemberByNick(nick,pw){
  var n=nickNorm(nick);if(!n)return null;
  var cands=S.members.filter(function(x){return nickNorm(x.name)===n;});
  if(!cands.length)cands=S.members.filter(function(x){return nickBase(x.name)===nickBase(n);});
  var hits=[];
  for(var i=0;i<cands.length;i++){if(await checkPw(cands[i],pw))hits.push(cands[i]);}
  return hits.length===1?hits[0]:null;
}

function ckKey(sid,wn,mid){return sid+'__'+wn+'__'+mid;}

// 스터디 카드 체크리스트 (주차 인증과 별개, 멤버 본인 것만 체크). 스터디 하나에 여러 개의 카드리스트(덱)를 둘 수 있음
function cardCkKey(sid,did,cid,mid){return sid+'__card__'+did+'__'+cid+'__'+mid;}
function cardCk(sid,did,cid,mid){return S.checkins[cardCkKey(sid,did,cid,mid)]||null;}

function rtnCardsKey(sid,dk,mid){return sid+'__rcards__'+dk+'__'+mid;}
function rtnCards(sid,dk,mid){var v=S.checkins[rtnCardsKey(sid,dk,mid)];return v?v.split(','):[];}
function setRtnCards(sid,dk,mid,arr){var k=rtnCardsKey(sid,dk,mid);if(arr&&arr.length)S.checkins[k]=arr.join(',');else delete S.checkins[k];}
function toggleRtnCard(sid,dk,mid,cid){var arr=rtnCards(sid,dk,mid);var i=arr.indexOf(cid);if(i>=0)arr.splice(i,1);else arr.push(cid);setRtnCards(sid,dk,mid,arr);return arr;}
// 루틴 체크 - 멤버별 카드 노출 통계 (지금까지 선택한 모든 날짜 기준). 반환: {cardId:{count, dates:[dateKey,...]}}
function rtnCardStats(sid,mid){
  var stats={};
  var prefix=sid+'__rcards__',suffix='__'+mid;
  Object.keys(S.checkins).forEach(function(k){
    if(k.indexOf(prefix)!==0)return;
    if(k.slice(-suffix.length)!==suffix)return;
    var dk=k.slice(prefix.length,k.length-suffix.length);
    var ids=S.checkins[k]?S.checkins[k].split(','):[];
    ids.forEach(function(cid){
      if(!stats[cid])stats[cid]={count:0,dates:[]};
      stats[cid].count++;stats[cid].dates.push(dk);
    });
  });
  Object.keys(stats).forEach(function(cid){stats[cid].dates.sort();});
  return stats;
}

function getSkipDays(startDate,now){
  // 등록된 휴강 기간 중 startDate~now 사이에 겹치는 일수를 모두 더해서 반환
  if(!S.skipWeeks||!S.skipWeeks.length)return 0;
  var total=0;
  S.skipWeeks.forEach(function(sw){
    if(!sw.startDate||!sw.endDate)return;
    var swStart=new Date(sw.startDate);swStart.setHours(0,0,0,0);
    var swEnd=new Date(sw.endDate);swEnd.setHours(0,0,0,0);swEnd.setDate(swEnd.getDate()+1);//종료일 포함(배타적 끝)
    var ovStart=swStart>startDate?swStart:startDate;
    var ovEnd=swEnd<now?swEnd:now;
    if(ovEnd>ovStart)total+=Math.round((ovEnd-ovStart)/(24*60*60*1000));
  });
  return total;
}
function getCurrentWeek(s){
  if(!s.startDate)return 0;
  var start=new Date(s.startDate);start.setHours(0,0,0,0);
  var now=new Date();now.setHours(0,0,0,0);
  var diff=now-start;
  if(diff<0)return 0;
  diff-=getSkipDays(start,now)*24*60*60*1000;
  if(diff<0)diff=0;
  return Math.floor(diff/(7*24*60*60*1000))+1;
}

  var today=new Date();var done=0,total=0;

    var dt=new Date(yr,mo,d);if(dt>today)break;
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    total++;if(rtnCk(sid,dk,mid)==='done')done++;
  }
  return total>0&&done/total>=0.5;
}

// ── 루틴 월별 달력 모달 ──
function rRoutineCal(sid, mid, ym){
  var s=S.studies.filter(function(x){return x.id===sid;})[0];
  var m=S.members.filter(function(x){return x.id===mid;})[0];
  if(!s||!m)return '';
  var today=new Date();
  var ymKey=ym||(today.getFullYear()+'-'+(today.getMonth()+1+'').padStart(2,'0'));
  var yma=ymKey.split('-');var yr=+yma[0],mo=+yma[1]-1;
  var firstDay=new Date(yr,mo,1).getDay();
  if(firstDay===0)firstDay=7; // 월요일 시작
  firstDay=firstDay-1;
  var lastDate=new Date(yr,mo+1,0).getDate();
  var prevYm=mo===0?(yr-1)+'-12':yr+'-'+(mo+'').padStart(2,'0');
  var nextYm=mo===11?(yr+1)+'-01':yr+'-'+(mo+2+'').padStart(2,'0');
  var canNext=new Date(yr,mo+1,1)<=today;

  var h='<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;" id="rtn-cal-modal">';
  h+='<div style="background:var(--wh);border-radius:var(--r);padding:1.25rem;width:min(360px,92vw);max-height:90vh;overflow-y:auto;">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  h+='<span style="font-size:14px;font-weight:700;color:var(--pr);">📅 '+esc(s.name)+'</span>';
  h+='<button id="rtn-cal-close" style="font-size:18px;background:none;border:none;cursor:pointer;color:var(--mu);">✕</button>';
  h+='</div>';
  h+='<div style="font-size:12px;color:var(--mu);margin-bottom:12px;">'+esc(m.name)+'님의 루틴 현황</div>';
  // 월 네비
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">';
  h+='<button data-rtn-cal-ym="'+prevYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:20px;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;">◀</button>';
  h+='<span style="font-size:13px;font-weight:700;color:var(--pr);">'+yr+'년 '+(mo+1)+'월</span>';
  h+='<button data-rtn-cal-ym="'+nextYm+'__'+sid+'__'+mid+'" style="padding:4px 10px;border-radius:20px;border:1px solid var(--br);background:var(--wh);cursor:pointer;font-size:12px;opacity:'+(canNext?'1':'0.3')+';pointer-events:'+(canNext?'auto':'none')+';">▶</button>';
  h+='</div>';
  // 달력 헤더
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">';
  ['월','화','수','목','금','토','일'].forEach(function(d,i){
    h+='<div style="text-align:center;font-size:10px;font-weight:700;color:'+(i>=5?'#EF4444':'var(--mu)')+';">'+d+'</div>';
  });
  h+='</div>';
  // 달력 날짜
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">';
  for(var i=0;i<firstDay;i++)h+='<div></div>';
  var doneCnt=0,totalCnt=lastDate; // 한 달 전체 일수 기준
  for(var d=1;d<=lastDate;d++){
    var dk=yr+'-'+(mo+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
    var st=rtnCk(sid,dk,mid);
    var dateObj=new Date(yr,mo,d);
    var isFuture=dateObj>today;
    var dow=dateObj.getDay();
    var isWeekend=dow===0||dow===6;
    if(st==='done')doneCnt++;
    var bg=st==='done'?'var(--pr)':st==='vacation'?'#3B82F6':isWeekend?'#FEF2F2':'#F8F9FA';
    var txtCol=st==='done'||st==='vacation'?'#fff':isWeekend?'#EF4444':'var(--tx)';
    var calMemo=rtnMemo(sid,dk,mid);
    var calCards=rtnCards(sid,dk,mid);
    h+='<div style="position:relative;">';
    h+='<div '+((!isFuture)?'data-cal-memo="'+sid+'__'+dk+'__'+mid+'" style="cursor:pointer;"':'style=""')+'>';
    h+='<div style="aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:'+bg+';color:'+txtCol+';'+(isFuture?'opacity:.3':'')+' position:relative;">'+d+'</div>';
    if(calMemo)h+='<div style="position:absolute;bottom:-1px;right:-1px;width:7px;height:7px;background:#F59E0B;border-radius:50%;border:1.5px solid #fff;"></div>';
    if(calCards.length)h+='<div title="'+calCards.length+'장"'+' style="position:absolute;top:-1px;right:-1px;width:7px;height:7px;background:#7B2FF7;border-radius:50%;border:1.5px solid #fff;"></div>';
    h+='</div>';
    h+='</div>';
  }
  h+='</div>';
  // 요약
  var pct=totalCnt?Math.round(doneCnt/totalCnt*100):0;
  h+='<div style="margin-top:12px;padding:.75rem;background:var(--prl);border-radius:var(--rs);text-align:center;">';
  h+='<div style="font-size:13px;font-weight:700;color:var(--pr);">✅ '+doneCnt+'일 달성 / 전체 '+totalCnt+'일 · '+pct+'%</div>';
  h+='</div>';
  h+='</div></div>';
  h+=rCalMemoPopup();
  return h;
}
// 날짜 메모 팝업 (내 현황 미니달력 / 멤버 현황 달력 공용)

// 루틴 카드 선택 UI (검색 + 체크박스 목록). 메모 팝업 / 전용 카드 팝업 공용
function rRoutineCardPickerHtml(sid,dk,mid,deck){
  if(!deck)return '';
  var picked=rtnCards(sid,dk,mid);
  var filter=(S.rtnCardFilter||'').trim().toLowerCase();
  var cards=deck.cards||[];
  var shown=filter?cards.filter(function(c){return c.name.toLowerCase().indexOf(filter)>=0;}):cards;
  var mStats=rtnCardStats(sid,mid); // 이 멤버가 지금까지 노출한 카드 (파란 볼드로 구분)
  var h='<div style="margin-top:12px;border-top:1px solid #F3D0E9;padding-top:10px;">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--pr);margin-bottom:6px;">🗂️ '+esc(deck.name)+' · '+picked.length+'장 선택됨</div>';
  h+='<div style="font-size:10px;color:#2563EB;font-weight:700;margin-bottom:6px;">■ 파란 글씨 = 이전에 노출한 적 있는 카드</div>';
  h+='<input type="text" id="rtn-card-filter" placeholder="카드 이름 검색..." value="'+esc(S.rtnCardFilter||'')+'" style="width:100%;padding:.4rem .6rem;border-radius:8px;border:1.5px solid var(--br);font-size:12px;margin-bottom:8px;box-sizing:border-box;">';
  h+='<div id="rtn-card-list" style="max-height:220px;overflow-y:auto;border:1px solid #F3D0E9;border-radius:8px;padding:.3rem;">';
  if(!cards.length){
    h+='<div style="font-size:12px;color:var(--mu);text-align:center;padding:.75rem;">덱에 등록된 카드가 없어요</div>';
  } else if(!shown.length){
    h+='<div style="font-size:12px;color:var(--mu);text-align:center;padding:.75rem;">검색 결과가 없어요</div>';
  } else {
    shown.forEach(function(c){
      var on=picked.indexOf(c.id)>=0;
      var exposed=!!mStats[c.id];
      h+='<label style="display:flex;align-items:center;gap:8px;padding:.3rem .4rem;border-radius:8px;cursor:pointer;'+(on?'background:var(--prl);':'')+'">'+
        '<input type="checkbox" data-rtn-cardtog="'+sid+'__'+dk+'__'+mid+'__'+c.id+'"'+(on?' checked':'')+' style="width:15px;height:15px;accent-color:var(--pr);flex-shrink:0;">'+
        '<span style="font-size:13px;color:'+(exposed?'#2563EB':'var(--tx)')+';font-weight:'+(exposed?'700':'400')+';">'+esc(c.name)+'</span>'+
      '</label>';
    });
  }
  h+='</div></div>';
  return h;
}
// 루틴 카드 노출 통계 (몇 회, 언제) - 내 현황 / 전체현황 공용
function rRoutineCardStatsHtml(sid,mid,deck){
  if(!deck)return '';
  var stats=rtnCardStats(sid,mid);
  var cards=deck.cards||[];
  var rows=cards.filter(function(c){return stats[c.id];}).map(function(c){
    return{name:c.name,count:stats[c.id].count,dates:stats[c.id].dates};
  }).sort(function(a,b){return b.count-a.count||a.name.localeCompare(b.name);});
  var h='<div style="margin-top:10px;padding-top:10px;border-top:1px solid #F3D0E9;">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--pr);margin-bottom:6px;">🗂️ '+esc(deck.name)+' 노출 통계 · '+rows.length+'/'+cards.length+'장</div>';
  if(!rows.length){
    h+='<div style="font-size:12px;color:var(--mu);text-align:center;padding:.5rem;">아직 노출한 카드가 없어요</div>';
  } else {
    h+='<div style="max-height:220px;overflow-y:auto;border:1px solid #F3D0E9;border-radius:8px;padding:.3rem .5rem;">';
    rows.forEach(function(r){
      var dstr=r.dates.map(function(d){var p=d.split('-');return (+p[1])+'/'+(+p[2]);}).join(', ');
      h+='<div style="padding:.3rem 0;border-bottom:1px solid #F9F9F9;">';
      h+='<div style="display:flex;align-items:center;gap:6px;"><span style="flex:1;font-size:12px;font-weight:600;color:var(--tx);">'+esc(r.name)+'</span><span style="font-size:11px;font-weight:700;color:var(--pr);white-space:nowrap;">'+r.count+'회</span></div>';
      h+='<div style="font-size:10px;color:var(--mu);margin-top:1px;">'+esc(dstr)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

  var h='<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:99999;display:flex;align-items:center;justify-content:center;" id="rtn-card-overlay">';

function impArr(x){return Array.isArray(x)?x.filter(Boolean):(x?Object.values(x).filter(Boolean):[]);}
function impBuildPlan(raw,pairs){
  var V=raw.vip||{},N=raw.nw||{},cl=function(o){return JSON.parse(JSON.stringify(o));};
  var rep={autoMerged:[],manualMerged:[],newOnly:[],sidRenamed:0,midRenamed:0,ckV:0,ckN:0,ckSkipped:0,ckConflict:0};
  // 스터디
  var vS=impArr(V.studies).map(cl),nS=impArr(N.studies).map(cl);
  var used={};vS.forEach(function(s){used[s.id]=1;});
  var sidMap={};
  nS.forEach(function(s){var nid=s.id;if(used[nid]){nid='n_'+s.id;while(used[nid])nid+='x';rep.sidRenamed++;}used[nid]=1;sidMap[s.id]=nid;});
  vS.forEach(function(s){if(!s.tiers)s.tiers=['vip','clover'];});
  nS.forEach(function(s){
    s.id=sidMap[s.id];s.tiers=['new'];
    if(s.routineDeckId&&s.routineDeckId.indexOf('__')>0){var p=s.routineDeckId.split('__');if(sidMap[p[0]])p[0]=sidMap[p[0]];s.routineDeckId=p.join('__');}
  });
  // 멤버
  var vM=impArr(V.members).map(cl),nM=impArr(N.members).map(cl);
  var vById={},vByNick={},usedM={};
  vM.forEach(function(m){m.tier=m.tier||'vip';vById[m.id]=m;vByNick[nickNorm(m.name)]=m;usedM[m.id]=1;});
  var midMap={},outNew=[];
  nM.forEach(function(m){
    var origId=m.id,target=null,how='';
    if(pairs[m.id]!==undefined){if(pairs[m.id])target=vById[pairs[m.id]];how='manual';}
    else{target=vByNick[nickNorm(m.name)]||null;how='auto';}
    var sids=(m.studyIds||[]).map(function(x){return sidMap[x];}).filter(Boolean);
    if(target){
      midMap[m.id]=target.id;
      target.studyIds=target.studyIds||[];
      sids.forEach(function(x){if(target.studyIds.indexOf(x)<0)target.studyIds.push(x);});
      (how==='auto'?rep.autoMerged:rep.manualMerged).push({nw:m.name,vip:target.name,nid:m.id});
    }else{
      var nid=m.id;if(usedM[nid]){nid='n_'+m.id;while(usedM[nid])nid+='x';rep.midRenamed++;}usedM[nid]=1;
      midMap[m.id]=nid;m.id=nid;m.tier='new';m.studyIds=sids;outNew.push(m);
      rep.newOnly.push({nw:m.name,nid:origId});
    }
  });
  var members=vM.concat(outNew);
  var usedL={};
  members.forEach(function(m){
    var base=m.loginId||m.name||m.id,l=base,k=2;
    while(usedL[idNorm(l)]){l=base+'_'+k;k++;}
    if(l!==base)rep.idRenamed=(rep.idRenamed||[]).concat([m.name+' → '+l]);
    usedL[idNorm(l)]=1;m.loginId=l;
  });
  // 인증 기록 (키 형식: 스터디id__...__멤버id)
  var ck={};
  Object.keys(V.checkins||{}).forEach(function(k){ck[k]=V.checkins[k];rep.ckV++;});
  Object.keys(N.checkins||{}).forEach(function(k){
    var p=k.split('__');if(p.length<3){rep.ckSkipped++;return;}
    var sid=sidMap[p[0]],mid=midMap[p[p.length-1]];
    if(!sid||!mid){rep.ckSkipped++;return;}
    p[0]=sid;p[p.length-1]=mid;var nk=p.join('__');
    if(ck[nk]!==undefined){rep.ckConflict++;return;}
    ck[nk]=N.checkins[k];rep.ckN++;
  });
  // 카테고리 순서 / 휴강주
  var catOrder=(V.catOrder||[]).slice();(N.catOrder||[]).forEach(function(c){if(catOrder.indexOf(c)<0)catOrder.push(c);});
  var sw=impArr(V.skipWeeks).map(cl);
  impArr(N.skipWeeks).forEach(function(x){if(!sw.some(function(y){return y.id===x.id||(y.startDate===x.startDate&&y.endDate===x.endDate);}))sw.push(cl(x));});
  // 일정 / 공지
  var tagMerge=function(a,b,ta,tb){
    var out={};
    Object.keys(a||{}).forEach(function(k){var o=cl(a[k]);if(!o.tiers)o.tiers=ta;out[k]=o;});
    Object.keys(b||{}).forEach(function(k){var o=cl(b[k]);o.tiers=tb;var nk=k;while(out[nk])nk='n_'+nk;o.id=nk;out[nk]=o;});
    return out;
  };
  var events=tagMerge(V.events,N.events,['vip','clover'],['new']);
  var notices=tagMerge(raw.vipNotices,raw.nwNotices,['vip','clover'],['new']);
  return{studies:vS.concat(nS),members:members,checkins:ck,catOrder:catOrder,skipWeeks:sw,events:events,notices:notices,report:rep,
    counts:{vS:vS.length,nS:nS.length,vM:vM.length,nM:nM.length,ev:Object.keys(events).length,nt:Object.keys(notices).length}};
}

  var blob=new Blob([JSON.stringify({savedAt:d.toISOString(),legacy:S.imp.raw,current:{studies:S.studies,members:S.members,checkins:S.checkins,catOrder:S.catOrder,events:S.events,skipWeeks:S.skipWeeks,signups:S.signups,notices:S.notices}})],{type:'application/json'});

        h+='</div>';
        h+='</div>';
      }
      h+='</div></div>';
    });
    h+='</div>';

    // ── 같은 루틴 신청 멤버 현황 ──
    rtnStudies.forEach(function(s){
      var others=S.members.filter(function(mem){
        return mem.id!==m.id&&(mem.studyIds||[]).indexOf(s.id)>=0;
      });
      if(!others.length)return;
      h+='<div class="sec" style="padding:.875rem;margin-top:0;">';
      h+='<div style="font-size:13px;font-weight:700;color:var(--pr);margin-bottom:10px;">👥 '+esc(s.name)+' 멤버 현황</div>';

        var done2=0,total2=0;
        for(var d=1;d<=lastDate2;d++){
          var dt2=new Date(yr2,mo2,d);if(dt2>today2)break;
          var dk2=yr2+'-'+(mo2+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0');
          total2++;if(rtnCk(s.id,dk2,mem.id)==='done')done2++;
        }
        var pct2=total2?Math.round(done2/total2*100):0;
        return{mem:mem,done:done2,total:total2,pct:pct2};
      }).sort(function(a,b){return b.pct-a.pct;});
      otherRows.forEach(function(r){
        var col2=r.pct>=80?'var(--pr)':r.pct>=50?'#F59E0B':'var(--mu)';
        var badge2=getRoutineMonthBadge(s.id,r.mem.id,yr2,mo2);

        h+='<span style="font-size:12px;min-width:80px;font-weight:600;">'+esc(r.mem.name)+(badge2?' 💎':'')+'</span>';

        h+='<div style="width:'+r.pct+'%;height:100%;background:'+col2+';border-radius:4px;"></div></div>';
        h+='<span style="font-size:11px;font-weight:700;color:'+col2+';min-width:36px;">'+r.pct+'%</span>';
        h+='<span style="font-size:10px;color:var(--mu);">'+r.done+'/'+r.total+'일</span>';
        h+='</div>';
      });
      h+='</div>';
    });
  }
  h+=rCalMemoPopup();
  return h+'</div>';
}

          '</select>'+
          '<button class="abtn" id="ev-add">추가</button>'+
        '</div>'+
        '<div style="margin-top:6px;">'+tierPickHtml('ev')+'</div>'+
      '</div></div>';
  }

  // 달력 그리드
  h+='<div style="background:var(--wh);border:1.5px solid #F3D0E9;border-radius:var(--r);overflow:hidden;">';
  // 요일 헤더

    h+='<div style="text-align:center;padding:.5rem 0;font-size:12px;font-weight:700;color:'+(i===0?'var(--rd)':i===6?'var(--bl)':'var(--tx)')+';">'+d+'</div>';
  });
  h+='</div>';
  // 날짜 그리드
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);">';
  for(var i=0;i<firstDay;i++) h+='<div style="min-height:60px;border-top:1px solid #F9EDF5;"></div>';
  for(var d=1;d<=lastDate;d++){
    var dateStr=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');

    if(s.bandUrl===undefined)s.bandUrl='';

        S.loggedMember=savedM;
        var lt=localStorage.getItem('kkang_last_tab');
        S.tab=(lt&&['ci','mp','apply','notice','cal','cp'].indexOf(lt)>=0)?lt:'ci';
      } else {
        localStorage.removeItem('kkang_member_id');
      }
    }
  }catch(e){}
  S.loading=false;render();
}
(async function(){
  render();
  var coreData=null;
  try{coreData=await fbLoad();}
  catch(e1){
    // 1회 재시도
    try{await new Promise(function(r){setTimeout(r,1500);});coreData=await fbLoad();}
    catch(e2){
      S.loading=false;
      var app=document.getElementById('app');
      if(app)app.innerHTML='<div class="loading">로드 실패. 인터넷 연결을 확인하고 새로고침해주세요.<br><br><button onclick="location.reload()" style="padding:.6rem 1.25rem;border-radius:20px;background:linear-gradient(135deg,#E91E8C,#7B2FF7);color:#fff;border:none;font-weight:700;cursor:pointer;">새로고침</button></div>';
      return;
    }
  }
  applyData(coreData);
  // 공지(이미지 포함)는 별도 경로에서 비동기로, 실패해도 앱은 정상 작동
  fbLoadNotices().then(function(nd){S.notices=nd||{};render();}).catch(function(){S.notices={};});
})();


</script>
